<style>
/* Layout: one phone-width column; header with view tabs, the chosen view below. Theme: Beige (warm paper, bronze accent, handwritten day line) */
:root{

  --accent:#8C6A3C; --accent-soft:#EFE3CF; --warn:#8F5A12; --warn-soft:#F6E7CC; --danger:#A3322A;
  --w-paike:#C29A45; --w-vahelduv:#7F9A92; --w-pilves:#A1958A; --w-vihm:#5F7A9C; --w-lumi:#9DB0C2; --w-aike:#86708F; --w-udu:#A9A18A;
  --f-display:"Cormorant Garamond","Didot",Georgia,serif;
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-note:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --note-size:1.4118rem; --note-size-s:1.1765rem; --hand-scale:1.3; --d-weight:700;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1714; --surface:#24201C; --ink:#EFE7DA; --muted:#A99C8B; --line:#36302A; --line-strong:#50473D;
  --accent:#D5B47E; --accent-soft:#3A2F22; --warn:#E8B565; --warn-soft:#3A2C17; --danger:#F08A80;
  --w-paike:#DDB65F; --w-vahelduv:#9DB8AF; --w-pilves:#9A8F82; --w-vihm:#8FA6C4; --w-lumi:#D6DFE8; --w-aike:#A88FB3; --w-udu:#C2BAA4;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1714; --surface:#24201C; --ink:#EFE7DA; --muted:#A99C8B; --line:#36302A; --line-strong:#50473D;
  --accent:#D5B47E; --accent-soft:#3A2F22; --warn:#E8B565; --warn-soft:#3A2C17; --danger:#F08A80;
  --w-paike:#DDB65F; --w-vahelduv:#9DB8AF; --w-pilves:#9A8F82; --w-vihm:#8FA6C4; --w-lumi:#D6DFE8; --w-aike:#A88FB3; --w-udu:#C2BAA4;

}

.btn{border:1px solid var(--line-strong);background:transparent;border-radius:11px;padding:9px 15px;cursor:pointer;font-size:0.8529rem}

.toast{font-size:0.8235rem;color:var(--accent);font-weight:600}
.note{margin:0;font-family:var(--f-note);font-size:var(--note-size);line-height:1.3;white-space:pre-wrap}

.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;width:100%}

</style>

.bg-paike{background:var(--w-paike)}.bg-vahelduv{background:var(--w-vahelduv)}.bg-pilves{background:var(--w-pilves)}.bg-vihm{background:var(--w-vihm)}.bg-lumi{background:var(--w-lumi)}.bg-aike{background:var(--w-aike)}.bg-udu{background:var(--w-udu)}
.px{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px}

<script>
(function(){
/* ---------- vocabulary (WMO weather code terms) ---------- */
const SKY=[['sunny','Sunny','i-paike','paike'],['partly','Partly cloudy','i-vahelduv','vahelduv'],['cloudy','Cloudy','i-pilves','pilves'],['fog','Fog','i-udu','udu']];
const PRECIP=[
  ['none','None','p-none','pilves','dry'],['showers','Showers','p-lshowers','vihm','rain'],
  ['rain','Rain','p-rain','vihm','rain'],['hrain','Heavy rain','p-hrain','vihm','rain'],
  ['lsnow','Light snow','p-lsnow','lumi','snow'],['hsnow','Heavy snow','p-hsnow','lumi','snow'],['thunder','Thunderstorm','i-aike','aike','rain']
];
const SKYM=Object.fromEntries(SKY.map(s=>[s[0],{label:s[1],icon:s[2],type:s[3]}]));
const PRM=Object.fromEntries(PRECIP.map(p=>[p[0],{label:p[1],icon:p[2],type:p[3],kind:p[4]}]));
const WMO={0:['sunny','none'],1:['sunny','none'],2:['partly','none'],3:['cloudy','none'],45:['fog','none'],48:['fog','none'],
  51:['cloudy','showers'],53:['cloudy','showers'],55:['cloudy','showers'],56:['cloudy','showers'],57:['cloudy','showers'],
  61:['cloudy','rain'],63:['cloudy','rain'],65:['cloudy','hrain'],66:['cloudy','rain'],67:['cloudy','hrain'],
  71:['cloudy','lsnow'],73:['cloudy','hsnow'],75:['cloudy','hsnow'],77:['cloudy','lsnow'],
  80:['partly','showers'],81:['partly','showers'],82:['partly','hrain'],85:['partly','lsnow'],86:['partly','hsnow'],
  95:['cloudy','thunder'],96:['cloudy','thunder'],99:['cloudy','thunder']};
const fromCode=c=>WMO[c]||['cloudy','none'];
const deriveType=(sky,pr)=>pr&&pr!=='none'?PRM[pr].type:(SKYM[sky]?SKYM[sky].type:'pilves');
const mainIcon=w=>w.precip&&w.precip!=='none'?PRM[w.precip].icon:SKYM[w.sky].icon;
const wLabel=w=>SKYM[w.sky].label+(w.precip&&w.precip!=='none'?' · '+PRM[w.precip].label:'');

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const KEY='ilmaraamat.v1';
const FALLBACK_PLACES=[
  {name:'Tartu',country:'Estonia',lat:58.378,lon:26.729},{name:'Tallinn',country:'Estonia',lat:59.437,lon:24.754},
  {name:'Pärnu',country:'Estonia',lat:58.386,lon:24.497},{name:'Helsinki',country:'Finland',lat:60.170,lon:24.938},
  {name:'London',country:'United Kingdom',lat:51.507,lon:-0.128},{name:'New York',country:'United States',lat:40.713,lon:-74.006},
  {name:'Chicago',country:'United States',lat:41.878,lon:-87.630},{name:'Sydney',country:'Australia',lat:-33.869,lon:151.209}
];
const inViewer=!!window.claude;

/* ---------- storage, with migration from the first test schema ---------- */
const OLD_TYPE={paike:['sunny','none'],vahelduv:['partly','none'],pilves:['cloudy','none'],udu:['fog','none'],vihm:['cloudy','rain'],lumi:['cloudy','hsnow'],aike:['cloudy','thunder']};
const PR_ALIAS={snow:'hsnow',sleet:'lsnow',drizzle:'showers',lshowers:'showers',hshowers:'showers',lrain:'rain'};
function normalize(d){
  for(const e of Object.values(d.entries||{})){
    const w=e.weather;if(!w||w.source==='none')continue;
    if(w.precip&&!PRM[w.precip])w.precip=PR_ALIAS[w.precip]||'none';
    if(!SKYM[w.sky])w.sky='cloudy';
    w.type=deriveType(w.sky,w.precip);
  }
  return d;
}
function migrate(d){
  if(d.schema===2)return normalize(d);
  for(const e of Object.values(d.entries||{})){
    const w=e.weather;if(!w||w.source==='none'||w.sky)continue;
    const[sky,pr]=w.source==='online'&&w.code!=null?fromCode(w.code):(OLD_TYPE[w.type]||['cloudy','none']);
    e.weather={source:w.source,code:w.code??null,sky,precip:pr,type:deriveType(sky,pr),tmax:w.tmax??null,tmin:w.tmin??null,tavg:null,mm:w.source==='online'?(w.precip??null):null};
  }
  d.schema=2;return normalize(d);
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.entries&&(d.schema===1||d.schema===2))return migrate(d);}}catch(e){}
  return {schema:2,settings:{home:null},entries:{}};
}
let DB={schema:2,settings:{home:{name:'Sample town',country:'',lat:52.0,lon:5.0},hideA2HS:true,lastBackupAt:new Date().toISOString()},entries:{}},storageOk=true;
function save(){storageOk=true;}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayIso=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const daysAgo=s=>Math.round((parse(todayIso())-parse(s))/864e5);
const US=/^en-US$/i.test(navigator.language||'');
const U=()=>DB.settings.units||{temp:US?'f':'c',precip:US?'in':'mm',date:US?'mdy':'dmy'};
const mdy=()=>U().date==='mdy';
const dm=(d,m)=>mdy()?`${m} ${d}`:`${d} ${m}`;
const longDate=s=>{const d=parse(s);return mdy()?`${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`:`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;};
const shortDate=s=>{const d=parse(s),m=MONTHS[d.getMonth()].slice(0,3);return `${WD[d.getDay()].slice(0,3)}, ${mdy()?`${m} ${d.getDate()},`:`${d.getDate()} ${m}`} ${d.getFullYear()}`;};

/* ---------- formatting ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isF=()=>U().temp==='f';
const cv=v=>v==null||isNaN(v)?null:(isF()?v*1.8+32:v);
const toC=v=>v==null||isNaN(v)?null:(isF()?Math.round((v-32)/1.8*10)/10:v);
const tUnit=()=>isF()?'°F':'°C';
const fTraw=v=>{if(v==null||isNaN(v))return '–';const r=Math.round(v);return (r>0&&!isF()?'+':r<0?'−':'')+Math.abs(r)+'°';};
const fT=v=>fTraw(cv(v));
const fMM=v=>v==null?'':(v<0.05?'dry':U().precip==='in'?(Math.round(v/25.4*100)/100)+' in':(Math.round(v*10)/10)+' mm');
const svg=(id,t,cls='ic')=>`<svg class="${cls} t-${t}" aria-hidden="true"><use href="#${id}"/></svg>`;
const mainT=w=>w.tmax??w.tavg??w.tmin??null;
function tempHtml(w){
  if(w.tmax!=null&&w.tmin!=null)return `${fT(w.tmax)} <span>${fT(w.tmin)}</span>`;
  if(w.tmax!=null)return `${fT(w.tmax)} <span>high</span>`;
  if(w.tavg!=null)return `≈${fT(w.tavg)} <span>around</span>`;
  if(w.tmin!=null)return `${fT(w.tmin)} <span>low</span>`;
  return `<span>no temperature</span>`;
}

/* ---------- weather service ---------- */
const cache={};
function simulated(date,home){
  let h=0;const s=date+home.lat.toFixed(2);for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;
  const r=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};
  const d=parse(date),doy=Math.round((d-new Date(d.getFullYear(),0,1))/864e5);
  const mean=6.5-11.5*Math.cos(2*Math.PI*(doy-16)/365+(home.lat<0?Math.PI:0))+(r()-.5)*8;
  const tmax=Math.round((mean+4+r()*2)*10)/10,tmin=Math.round((mean-4-r()*2)*10)/10;
  let code,mm=0;const c=r();
  if(c<.38){mm=Math.round((0.4+r()*9)*10)/10;code=mean<0.5?(mm>4?75:71):(tmax>21&&r()<.3?95:(mm<1.5?51:mm<4?61:mm<7?63:80));}
  else if(c<.55)code=0;else if(c<.78)code=2;else if(c<.84)code=45;else code=3;
  return build(code,tmax,tmin,mm,true);
}
function build(code,tmax,tmin,mm,demo){const[sky,pr]=fromCode(code);return {code,sky,precip:pr,type:deriveType(sky,pr),tmax,tmin,tavg:null,mm,demo};}
/* ---------- online weather: MET Norway for today, NASA POWER for past days ---------- */
const MET_URL='https://api.met.no/weatherapi/locationforecast/2.0/compact';
const NASA_URL='https://power.larc.nasa.gov/api/temporal/daily/point';
function metSym(code){
  const c=String(code||'').replace(/_(day|night|polartwilight)$/,'');
  if(c.includes('thunder'))return {sky:'cloudy',pr:'thunder'};
  if(c==='clearsky'||c==='fair')return {sky:c==='fair'?'partly':'sunny',pr:'none'};
  if(c==='partlycloudy')return {sky:'partly',pr:'none'};
  if(c==='cloudy')return {sky:'cloudy',pr:'none'};
  if(c==='fog')return {sky:'fog',pr:'none'};
  if(/snow|sleet/.test(c))return {sky:'cloudy',pr:/heavy/.test(c)?'hsnow':'snow'};
  if(/rain/.test(c))return {sky:/showers/.test(c)?'partly':'cloudy',pr:'rain'};
  return {sky:'cloudy',pr:'none'};
}
/* Merge every forecast fetch into a small per-day store, so an evening entry still knows the morning. */
function metMerge(json){
  const ts=json&&json.properties&&json.properties.timeseries;if(!Array.isArray(ts))return 0;
  DB.met=DB.met||{};let n=0;
  for(const t of ts){
    const d=new Date(t.time);if(isNaN(d))continue;
    const day=iso(d),h=d.getHours(),det=t.data&&t.data.instant&&t.data.instant.details,n1=t.data&&t.data.next_1_hours;
    if(!det||det.air_temperature==null)continue;
    const rec=DB.met[day]=DB.met[day]||{};
    rec[h]={t:det.air_temperature,s:n1&&n1.summary?n1.summary.symbol_code:(rec[h]&&rec[h].s)||null,p:n1&&n1.details&&n1.details.precipitation_amount!=null?n1.details.precipitation_amount:(rec[h]&&rec[h].p!=null?rec[h].p:null)};
    n++;
  }
  for(const k of Object.keys(DB.met))if(k<addDays(todayIso(),-3))delete DB.met[k];
  DB.settings.metAt=new Date().toISOString();save();return n;
}
function metDay(date){
  const rec=DB.met&&DB.met[date];if(!rec)return null;
  const hrs=Object.keys(rec).map(Number).sort((a,b)=>a-b);if(hrs.length<3)return null;
  const T=hrs.map(h=>rec[h].t),P=hrs.map(h=>rec[h].p).filter(v=>v!=null),mm=Math.round(P.reduce((a,b)=>a+b,0)*10)/10;
  const syms=hrs.map(h=>rec[h].s).filter(Boolean).map(metSym);
  const skyCount={};syms.forEach(x=>{if(x.pr==='none')skyCount[x.sky]=(skyCount[x.sky]||0)+1;});
  let sky=Object.keys(skyCount).sort((a,b)=>skyCount[b]-skyCount[a])[0]||'cloudy';
  if(sky!=='fog'&&(skyCount.fog||0)>=3)sky='fog';
  let precip='none';
  if(syms.some(x=>x.pr==='thunder'))precip='thunder';
  else if(mm>=0.3){const snowH=syms.filter(x=>x.pr==='snow'||x.pr==='hsnow').length,rainH=syms.filter(x=>x.pr==='rain').length;
    precip=snowH>rainH?(mm<3?'lsnow':'hsnow'):(mm<2?'showers':mm<8?'rain':'hrain');
    if(sky==='sunny')sky='partly';}
  const from=hrs[0],to=hrs[hrs.length-1];
  return {code:null,sky,precip,type:deriveType(sky,precip),tmax:Math.round(Math.max(...T)*10)/10,tmin:Math.round(Math.min(...T)*10)/10,tavg:null,mm,provider:'met',hours:[from,to],demo:false};
}
async function metFetch(home){
  const res=await fetch(`${MET_URL}?lat=${home.lat.toFixed(3)}&lon=${home.lon.toFixed(3)}`);
  if(!res.ok)throw {kind:'http',status:res.status};
  return metMerge(await res.json());
}
function nasaDay(json,date){
  const p=json&&json.properties&&json.properties.parameter,k=date.replace(/-/g,'');if(!p)return null;
  const g=n=>{const v=p[n]&&p[n][k];return v==null||v<=-990?null:v;};
  const tmax=g('T2M_MAX'),tmin=g('T2M_MIN'),mm=g('PRECTOTCORR'),cl=g('CLOUD_AMT');
  if(tmax==null||tmin==null)return null;
  const mean=(tmax+tmin)/2;
  let sky=cl==null?'cloudy':cl<25?'sunny':cl<60?'partly':'cloudy',precip='none';
  if(mm!=null&&mm>=0.3){precip=mean<0.5?(mm<3?'lsnow':'hsnow'):(mm<2?'showers':mm<8?'rain':'hrain');if(sky==='sunny')sky='partly';}
  return {code:null,sky,precip,type:deriveType(sky,precip),tmax:Math.round(tmax*10)/10,tmin:Math.round(tmin*10)/10,tavg:null,mm:mm==null?null:Math.round(mm*10)/10,provider:'nasa',estimated:true,demo:false};
}
async function nasaFetch(date,home){
  const d=date.replace(/-/g,'');
  const res=await fetch(`${NASA_URL}?parameters=T2M_MAX,T2M_MIN,PRECTOTCORR,CLOUD_AMT&community=AG&latitude=${home.lat.toFixed(3)}&longitude=${home.lon.toFixed(3)}&start=${d}&end=${d}&format=JSON`);
  if(!res.ok)throw {kind:'http',status:res.status};
  return nasaDay(await res.json(),date);
}
function build(code,tmax,tmin,mm,demo){const[sky,pr]=fromCode(code);return {code,sky,precip:pr,type:deriveType(sky,pr),tmax,tmin,tavg:null,mm,demo};}
async function fetchWeather(date,home){
  const k=date+'|'+home.lat+'|'+home.lon;if(cache[k])return cache[k];
  const ago=daysAgo(date);
  try{
    let w=null;
    if(ago===0){await metFetch(home);w=metDay(date);if(!w)throw {kind:'nodata'};}
    else if(ago===1){w=metDay(date);if(!w){try{w=await nasaFetch(date,home);}catch(e){}}if(!w)throw {kind:'yesterday'};}
    else{w=await nasaFetch(date,home);if(!w)throw {kind:'nodata'};}
    if(ago>0)cache[k]=w;return w;
  }catch(e){
    if(e instanceof TypeError&&inViewer){const w=simulated(date,home);cache[k]=w;return w;}
    if(e&&e.kind==='yesterday')throw new Error('Yesterday’s online weather isn’t ready yet. It arrives in a day or two. Enter your own, choose No weather, or come back to this day later.');
    if(e&&e.kind==='nodata')throw new Error('No online weather for this day. Enter your own, or choose No weather.');
    throw new Error('Could not load the weather. Check your internet connection, or enter your own.');
  }
}

async function warmMet(){
  const home=DB.settings.home;if(!home)return;
  const at=DB.settings.metAt?new Date(DB.settings.metAt).getTime():0;
  if(Date.now()-at<45*60*1000)return;
  try{await metFetch(home);}catch(e){}
}
async function searchPlaces(q){
  try{
    const res=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=en&q='+encodeURIComponent(q));
    if(!res.ok)throw new TypeError('http');
    const j=await res.json();
    return {live:true,matched:true,list:(Array.isArray(j)?j:[]).map(r=>{const a=r.address||{};const nm=r.name||String(r.display_name||'').split(',')[0];
      return {name:nm,country:[a.county||a.state,a.country].filter(Boolean).filter(x=>x!==nm).join(', '),lat:+r.lat,lon:+r.lon};}).filter(p=>p.name&&!isNaN(p.lat))};
  }catch(e){
    const ql=q.trim().toLowerCase();
    const hit=FALLBACK_PLACES.filter(p=>ql&&(p.name.toLowerCase().includes(ql)||p.country.toLowerCase().includes(ql)));
    return {live:false,matched:hit.length>0,list:hit.length?hit:FALLBACK_PLACES};
  }
}

function yearsChart(list,cy){
  const n=list.length,cw=Math.max(44,Math.min(64,300/n)),L=36,W0=Math.max(340,L+cw*n+6),top=44,bot=150,H=186;
  const st=isF()?10:5,vals=list.flatMap(e=>[e.weather.tmax,e.weather.tmin,e.weather.tavg]).filter(v=>v!=null).map(cv).concat([isF()?32:0]);
  let lo=Math.floor(Math.min(...vals)/st)*st,hi=Math.ceil(Math.max(...vals)/st)*st;if(hi===lo)hi=lo+st;
  const y=v=>bot-(v-lo)/(hi-lo)*(bot-top);
  let g='';
  for(let v=lo;v<=hi;v+=st)g+=`<line class="${v===0&&!isF()?'zero':'grid'}" x1="${L}" x2="${W0-4}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fTraw(v)}</text>`;
  const bw=Math.min(22,cw*.42);
  list.forEach((e,i)=>{
    const w=e.weather,cx=L+cw*(i+.5),yr=+e.date.slice(0,4),cur=yr===cy;
    if(cur)g+=`<rect x="${cx-cw/2+3}" y="4" width="${cw-6}" height="${H-8}" rx="10" fill="var(--accent-soft)"/>`;
    g+=`<use href="#${mainIcon(w)}" x="${cx-11}" y="8" width="22" height="22" class="t-${w.type}"/>`;
    if(w.tmax!=null&&w.tmin!=null){
      g+=`<rect class="fill-${w.type}" x="${cx-bw/2}" y="${y(cv(w.tmax))}" width="${bw}" height="${Math.max(3,y(cv(w.tmin))-y(cv(w.tmax)))}" rx="${bw/2}"/>`;
      g+=`<text class="strong" x="${cx}" y="${y(cv(w.tmax))-5}" text-anchor="middle">${fT(w.tmax)}</text><text x="${cx}" y="${y(cv(w.tmin))+13}" text-anchor="middle">${fT(w.tmin)}</text>`;
    } else {const v=mainT(w);g+=`<circle class="fill-${w.type}" cx="${cx}" cy="${y(cv(v))}" r="6"/><text class="strong" x="${cx}" y="${y(cv(v))-10}" text-anchor="middle">${w.tmax==null&&w.tavg!=null?'≈':''}${fT(v)}</text>`;}
    g+=`<text class="strong" x="${cx}" y="${bot+28}" text-anchor="middle" style="font-weight:${cur?600:400}">${yr}</text>`;
  });
  return `<div class="chartbox"><svg viewBox="0 0 ${W0} ${H}" style="min-width:${Math.min(W0,900)}px" role="img" aria-label="Temperature on this date, year by year">${g}</svg></div>`;
}

const SAMPLE_NOTES={
  winter:['Shovelled snow before work.','The car would not start this morning.','Evening ski on the lit trail.','Frost flowers on the window.','Sledding with the kids, red cheeks.','Dark all day, lamps on till noon.','Tits at the bird feeder.','Icy road, drove slowly.'],

  autumn:['Mushroom picking, the basket half full.','Raked leaves, the kids jumped in the pile.','Dug the potatoes.','Lit the stove for the first time.','Cranes flying south over the house.','Thick fog in the morning.','Rain all day, a book and tea.','Picked the apples, the cellar smells sweet.'],

};
const realEntries=()=>Object.values(DB.entries).filter(e=>!e.sample);
const sampleCount=()=>Object.values(DB.entries).filter(e=>e.sample).length;
function addSamples(){
  const home=DB.settings.home;if(!home)return;
  let a=1234;const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const now=new Date().toISOString(),end=addDays(todayIso(),-1);
  for(let d=new Date(new Date().getFullYear()-4,0,1);iso(d)<=end;d.setDate(d.getDate()+1)){
    const ds=iso(d),gap=r()<0.1,hasNote=r()<0.55,pr=r();
    if(DB.entries[ds]||gap)continue;
    const w=simulated(ds,home),m=d.getMonth(),season=(m===11||m<=1)?'winter':m<=4?'spring':m<=7?'summer':'autumn';
    const pool=pr<0.7?SAMPLE_NOTES[season]:SAMPLE_NOTES.any;
    DB.entries[ds]={date:ds,text:hasNote?pool[Math.floor(r()*pool.length)]:'',weather:{source:'online',code:w.code,sky:w.sky,precip:w.precip,type:w.type,tmax:w.tmax,tmin:w.tmin,tavg:null,mm:w.mm},place:{name:home.name,lat:home.lat,lon:home.lon},demo:false,sample:true,createdAt:now,updatedAt:now};
  }
  for(let y=new Date().getFullYear()-4;y<=new Date().getFullYear();y++){
    const E=Object.values(DB.entries).filter(e=>e.sample&&e.date.startsWith(y+'-')).sort((a,b)=>a.date.localeCompare(b.date));
    const tag=(e,k)=>{if(e){e.firsts=[...(e.firsts||[]),k];}};
    const snowy=e=>e.weather.precip==='lsnow'||e.weather.precip==='hsnow';
    tag(E.find(e=>+e.date.slice(5,7)>=9&&snowy(e)),'snow');
    tag([...E].reverse().find(e=>+e.date.slice(5,7)<=5&&snowy(e)),'lastsnow');
    tag(E.find(e=>+e.date.slice(5,7)>=8&&e.weather.tmin<0),'frost');
    tag(E.find(e=>e.weather.precip==='thunder'),'thunder');
    tag(E.find(e=>+e.date.slice(5,7)>=5&&e.weather.tmax>=22),'swim');
    tag(E.find(e=>e.date.slice(5)>='04-15'&&e.weather.tmax>=12),'flowers');
    tag(E.find(e=>e.date.slice(5)>='09-12'&&e.weather.tmin<6),'leaves');
    tag(E.find(e=>e.date.slice(5)>='06-10'&&e.weather.sky==='sunny'),'c:First strawberries');
  }
  save();
}

/* ---------- Chart: temperature curve and wet days ---------- */
function smooth(y){

const CH={W:360,H:230,L:34,R:8,top:12,bot:198};
function chartView(){
  const y=S.year,years=dataYears(),series=years.map(yy=>[yy,smooth(yy)]),all=series.flatMap(s=>s[1].filter(v=>v!==null));

  for(let m=0;m<12;m++)g+=`<text x="${X(doyOf(2025,m,1))+2}" y="${H-12}">${MSHORT[m][0]}</text>`;
  const path=a=>{let p='',pen=false;a.forEach((v,i)=>{if(v===null){pen=false;return;}p+=(pen?'L':'M')+X(i).toFixed(1)+' '+Yv(v).toFixed(1);pen=true;});return p;};
  series.filter(s=>s[0]!==y).forEach(([,a])=>g+=`<path d="${path(a)}" fill="none" stroke="var(--line-strong)" stroke-width="1.2"/>`);
  g+=`<path d="${path(series.find(s=>s[0]===y)[1])}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;

  h+=`<h2>Daily high temperature</h2><p class="hint" style="margin:6px 0 10px"><b style="color:var(--accent)">${y}</b> as the bold line, your other years in grey behind it. Smoothed over a week. Drawn only from your own entries; gaps are days you didn’t save.</p>

  const pmax=Math.max(5,Math.ceil(Math.max(...cur,...(avg||[0]))/5)*5),PH=180,pt=10,pb=150,cw=(W-L-Rr)/12,PY=v=>pb-v/pmax*(pb-pt);

}

/* ---------- Stats: the year in numbers, with your own words ---------- */

}

function firstsView(){
  const by={};
  for(const e of Object.values(DB.entries))for(const k of e.firsts||[]){(by[k]=by[k]||[]).push(e);}
  const keys=Object.keys(by).sort((a,b)=>{const ia=FIRSTS.findIndex(f=>f[0]===a),ib=FIRSTS.findIndex(f=>f[0]===b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  if(!keys.length)return `<div class="empty"><div><b>No firsts yet.</b><br>When you write an entry, tap a label like ★ First snow or add your own. Each year they line up here, so you can see if spring comes earlier.</div><button class="btn" data-tab="day">Go to today</button></div>`;
  let h=`<p class="hint" style="margin:0 0 4px">Each dot is the day you marked, one row per year. The line shows your average date.</p>`;
  for(const k of keys){
    const per={};
    for(const e of by[k]){const y=eY(e);if(!per[y]||(isLastKind(k)?e.date>per[y].date:e.date<per[y].date))per[y]=e;}
    const years=Object.keys(per).map(Number).sort((a,b)=>a-b),pts=years.map(y=>({y,e:per[y],d:eDoy(per[y])}));
    h+=`<section class="frow"><h2 style="font-size:1.2941rem">★ ${esc(firstLabel(k))}</h2>${firstsChart(pts)}${firstsSummary(k,pts)}</section>`;
  }

}
function firstsChart(pts){
  const W=340,L=40,Rr=10,rowH=22,top=14,H=top+pts.length*rowH+22;
  let lo=Math.min(...pts.map(p=>p.d)),hi=Math.max(...pts.map(p=>p.d));
  const pad=Math.max(10,Math.round((hi-lo)*.15));lo=Math.max(0,lo-pad);hi=Math.min(365,hi+pad);if(hi-lo<30){const c=(hi+lo)/2;lo=Math.max(0,c-15);hi=Math.min(365,c+15);}
  const X=d=>L+(d-lo)/(hi-lo)*(W-L-Rr);
  let g='';
  for(let m=0;m<12;m++){const d=doyOf(2025,m,1);if(d>=lo&&d<=hi)g+=`<line class="grid" x1="${X(d)}" x2="${X(d)}" y1="${top-6}" y2="${H-20}"/><text x="${X(d)+3}" y="${H-6}">${MSHORT[m]}</text>`;}
  const avg=pts.reduce((s,p)=>s+p.d,0)/pts.length;
  if(pts.length>1)g+=`<line x1="${X(avg)}" x2="${X(avg)}" y1="${top-6}" y2="${H-20}" stroke="var(--accent)" stroke-dasharray="3 3" stroke-width="1.5"/>`;
  pts.forEach((p,i)=>{const yy=top+i*rowH+rowH/2,last=i===pts.length-1;
    g+=`<text x="${L-6}" y="${yy+4}" text-anchor="end" class="${last?'strong':''}">${p.y}</text><circle cx="${X(p.d)}" cy="${yy}" r="${last?6:4.5}" fill="${last?'var(--accent)':'var(--muted)'}"/>`;
    const lx=X(p.d)+10,anchor=lx>W-70?'end':'start';
    g+=`<text x="${anchor==='end'?X(p.d)-10:lx}" y="${yy+4}" text-anchor="${anchor}">${dm(eD(p.e),MSHORT[eM(p.e)])}</text>`;});
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dates year by year">${g}</svg></div>`;
}
function firstsSummary(k,pts){
  const last=pts[pts.length-1],prev=pts.slice(0,-1);
  if(!prev.length)return `<p class="hint">${dLabel(last.e)} ${last.y}. Mark it again next year to compare.</p>`;
  const avg=prev.reduce((s,p)=>s+p.d,0)/prev.length,diff=Math.round(last.d-avg);
  const rel=diff===0?'right on your average':diff<0?`${-diff} ${-diff===1?'day':'days'} earlier than your average`:`${diff} ${diff===1?'day':'days'} later than your average`;
  const early=pts.reduce((a,b)=>b.d<a.d?b:a),late=pts.reduce((a,b)=>b.d>a.d?b:a);
  return `<p class="fsum"><b>${dLabel(last.e)} ${last.y}</b>, ${rel}.${pts.length>2?` Earliest ${dLabel(early.e)} ${early.y}, latest ${dLabel(late.e)} ${late.y}.`:''}${last.e.text?` <span class="hand">“${esc(last.e.text)}”</span>`:''}</p>`;
}

function startEdit(){

}
function validate(){
  const d=S.draft,text=d.text.trim();
  if(d.source==='none'&&!text&&!d.firsts.length)return 'Write a line or keep the weather, so there is something to save.';
  if(d.source==='online'){
    if(S.wstate.status==='loading')return 'The weather is still loading. Wait a moment and save again.';
    if(S.wstate.status!=='ok')return 'The online weather did not load. Try again, enter your own, or choose No weather.';
  }
  if(d.source==='manual'){
    const m={...d.m,tmax:toC(d.m.tmax),tmin:toC(d.m.tmin),tavg:toC(d.m.tavg)},ok=v=>v==null||(!isNaN(v)&&v>=-70&&v<=60);
    if(!m.sky)return 'Pick the sky, for example Sunny or Cloudy.';
    if(!ok(m.tmax)||!ok(m.tmin)||!ok(m.tavg))return isF()?'Temperatures should be between −94 and +140 °F.':'Temperatures should be between −70 and +60 °C.';
    if(m.tmax!=null&&m.tmin!=null&&m.tmin>m.tmax)return 'The low temperature can’t be higher than the high.';
    if(m.tavg!=null&&m.tmax!=null&&m.tavg>m.tmax)return '“Around” can’t be higher than the high.';

}

/* ---------- files: save and share ---------- */
const DL=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function saveFile(name,data,mime){
  const dl=await DL;
  if(dl){
    try{await dl.save({filename:name,data});return 'saved';}
    catch(e){
      const c=e&&e.code;
      if(c==='declined')return 'declined';
      if(c==='rate_limited')throw new Error('A save is already waiting for your answer. Finish that one first.');
      if(!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c))throw new Error('The file could not be saved. Try again.');
    }
  }
  const file=new File([data],name,{type:mime});
  if(navigator.canShare&&navigator.share){
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'saved';}}
    catch(e){if(e&&e.name==='AbortError')return 'declined';}
  }
  const url=URL.createObjectURL(file),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  return 'saved';
}

/* ---------- restore: merge, newest edit of a day wins ---------- */
const ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
function cleanEntry(e){
  if(!e||typeof e!=='object'||!ISO_RE.test(e.date||''))return null;
  const w=e.weather&&typeof e.weather==='object'?e.weather:{source:'none'};
  const out={date:e.date,text:typeof e.text==='string'?e.text:'',weather:w,place:e.place||null,demo:!!e.demo,createdAt:e.createdAt||e.updatedAt||new Date(0).toISOString(),updatedAt:e.updatedAt||e.createdAt||new Date(0).toISOString()};
  if(w.source!=='online'&&w.source!=='manual')out.weather={source:'none'};
  if(Array.isArray(e.firsts)){const f=e.firsts.filter(k=>typeof k==='string'&&k.length<=60);if(f.length)out.firsts=f;}
  return out;
}
function readBackup(text){
  let d;try{d=JSON.parse(text);}catch(e){throw new Error('This file isn’t a Rain or Shine backup. Choose the .json backup file, not the spreadsheet.');}
  if(!d||(d.format!=='rainorshine-backup'&&d.format!=='ilmaraamat-backup')||!Array.isArray(d.entries))throw new Error('This file isn’t a Rain or Shine backup. Choose the .json backup file, not the spreadsheet.');
  if(d.schema>2)throw new Error('This backup was made by a newer version of Rain or Shine Almanac. Update the tool first.');
  const wrap=normalize({entries:Object.fromEntries(d.entries.map(cleanEntry).filter(Boolean).map(e=>[e.date,e]))});
  const list=Object.values(wrap.entries).sort((a,b)=>a.date.localeCompare(b.date));
  let add=0,upd=0,same=0;
  for(const e of list){const cur=DB.entries[e.date];if(!cur||cur.sample)add++;else if(e.updatedAt>cur.updatedAt)upd++;else same++;}
  return {list,add,upd,same,bad:d.entries.length-list.length,home:d.settings&&d.settings.home,exportedAt:d.exportedAt};
}
function applyMerge(p){
  for(const e of p.list){const cur=DB.entries[e.date];if(!cur||cur.sample||e.updatedAt>cur.updatedAt)DB.entries[e.date]=e;}
  let homeNote='';
  if(!DB.settings.home&&p.home&&p.home.name){DB.settings.home=p.home;S.setup=false;homeNote=` Home is set to ${p.home.name}, as in the backup.`;}
  save();askPersist();
  S.bk={busy:'',err:'',preview:null,msg:`Done. Added ${p.add} ${p.add===1?'entry':'entries'}, updated ${p.upd}. ${p.same} ${p.same===1?'was':'were'} already up to date.${homeNote}`};
  render();
}

  if(b.msg)h+=`<p class="toast" role="status">${esc(b.msg)}</p>`;
  if(b.err)h+=`<p class="msg" role="alert">${esc(b.err)}</p>`;
  h+=`<section class="card"><div class="lbl">Keep it safe on your phone</div><p class="hint" style="font-size:0.8235rem">The diary lives on this device only, with no account and no server. Two habits keep it safe: add it to your Home Screen, and make a backup now and then. ${a2hsSteps()}</p></section>`;
  return h;
}

/* ---------- themes ---------- */
const THEMES={
  beige:{label:'Beige',sw:['#EEE6DA','#8C6A3C','#1A1714','#D5B47E'],font:null},
  minimal:{label:'Minimal',sw:['#FFFFFF','#111111','#0E0E0E','#F2F2F2'],
    font:{'--f-display':'"Archivo",system-ui,sans-serif','--f-body':'"Jost",system-ui,sans-serif','--d-weight':'800'},
    light:{bg:'#F5F5F3',surface:'#FFFFFF',ink:'#111111',muted:'#5E5E5C',line:'#E4E4E1','line-strong':'#BDBDB9',accent:'#111111','accent-soft':'#ECECE9',warn:'#8A5A00','warn-soft':'#FBF1DE',danger:'#B3261E',w:['#E0A100','#5E9FA8','#9A9A97','#2F6FD6','#93BDE4','#7A4FD0','#A3A996']},
    dark:{bg:'#0E0E0E',surface:'#191919',ink:'#F2F2F2',muted:'#A3A3A0',line:'#2B2B2B','line-strong':'#474747',accent:'#F2F2F2','accent-soft':'#2C2C2C',warn:'#E8B565','warn-soft':'#2E2614',danger:'#F08A80',w:['#F2C14E','#6FB7C0','#8F8F8C','#5B9BF0','#CFE3F7','#A88BF0','#9AA38E']}}
};
const TOKENS=['bg','surface','ink','muted','line','line-strong','accent','accent-soft','warn','warn-soft','danger'];
const WKEYS=['paike','vahelduv','pilves','vihm','lumi','aike','udu'];
function hostDark(){const t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
const TEXT_SIZES=[['auto','Automatic',null],['m','Normal',17],['l','Large',20],['xl','Extra large',23]];
function applyTextSize(){
  const t=TEXT_SIZES.find(x=>x[0]===(DB.settings.textSize||'auto'))||TEXT_SIZES[0];
  document.documentElement.style.fontSize=t[2]?t[2]+'px':'';
}
function applyTheme(){applyTextSize();
  const st=document.documentElement.style,th=THEMES[DB.settings.theme]||THEMES.beige;
  const all=[...TOKENS.map(k=>'--'+k),...WKEYS.map(k=>'--w-'+k),'--f-display','--f-body','--d-weight','--f-note','--note-size','--note-size-s','--hand-scale'];
  all.forEach(k=>st.removeProperty(k));st.removeProperty('color-scheme');
  if(th.light){const dk=hostDark(),t=dk?th.dark:th.light;TOKENS.forEach(k=>st.setProperty('--'+k,t[k]));WKEYS.forEach((k,i)=>st.setProperty('--w-'+k,t.w[i]));st.colorScheme=dk?'dark':'light';}
  if(th.font)for(const k in th.font)st.setProperty(k,th.font[k]);
  if(DB.settings.handwriting===false){st.setProperty('--f-note','var(--f-body)');st.setProperty('--note-size','1.0294rem');st.setProperty('--note-size-s','0.9118rem');st.setProperty('--hand-scale','1');}
}
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- settings screen ---------- */
function segRow(label,key,opts){
  const cur=U()[key];
  return `<div class="srow"><span>${label}</span><div class="seg2" role="group" aria-label="${label}">${opts.map(([v,l])=>`<button data-unit="${key}:${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div></div>`;
}
function settingsView(){
  const th=THEMES[DB.settings.theme]?DB.settings.theme:'beige',hw=DB.settings.handwriting!==false,home=DB.settings.home,hid=(DB.settings.hiddenTabs||[]).length;
  return `<div class="btns"><button class="btn small" data-act="close-settings">‹ Back to the diary</button></div><h2>Settings</h2>
  <section class="card"><div class="lbl">Units</div>
    ${segRow('Temperature','temp',[['c','°C'],['f','°F']])}
    ${segRow('Rain and snow','precip',[['mm','mm'],['in','inches']])}
    ${segRow('Dates','date',[['dmy','3 October'],['mdy','October 3']])}
    <p class="hint">Your entries are stored the same way whatever you choose, so you can switch any time.</p></section>
  <section class="card"><div class="lbl">Text size</div>
    <div class="tsizes" role="group" aria-label="Text size">${TEXT_SIZES.map(([k,l])=>`<button data-tsize="${k}" aria-pressed="${(DB.settings.textSize||'auto')===k}">${l}</button>`).join('')}</div>
    <p class="hint">Automatic follows your phone’s text size where the browser allows it.</p></section>
  <section class="card"><div class="lbl">Look</div>
    <div class="themes">${Object.entries(THEMES).map(([k,t])=>`<button data-theme-pick="${k}" aria-pressed="${th===k}"><span class="sw">${t.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span>${t.label}</button>`).join('')}</div>
    <button class="vrow" data-act="toggle-hand" aria-pressed="${hw}"><span>Handwritten diary lines<small>Turn off for plain, easier-to-read text</small></span><span class="sw2 ${hw?'on':''}" aria-hidden="true"></span></button></section>
  <section class="card"><div class="lbl">Home</div>
    <p style="margin:0">The weather is recorded for <b>${home?esc(home.name):'–'}</b>${home?` <span class="muted num">(${home.lat.toFixed(2)}, ${home.lon.toFixed(2)})</span>`:''}.</p>
    <div class="btns"><button class="btn small" data-act="change-home">Change place</button></div></section>
  <section class="card"><div class="lbl">Views</div>
    <p style="margin:0">${hid?`${hid} ${hid===1?'view is':'views are'} hidden.`:'All views are shown.'}</p>
    <div class="btns"><button class="btn small" data-act="open-views">Choose views</button></div></section>
  <section class="card"><div class="lbl">Keep your diary safe</div>
    <p class="hint" style="font-size:0.8235rem">The diary lives on this device only, with no account and no server. ${a2hsSteps()}</p>
    <div class="btns"><button class="btn small" data-act="open-backup">Backup &amp; restore</button></div></section>
  <section class="card"><div class="lbl">About</div>
    <p class="hint" style="font-size:0.7941rem">Today’s weather: data from <a href="https://api.met.no/" target="_blank" rel="noopener">MET Norway</a>, licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>, summarised into one line per day. Past days: estimated from <a href="https://power.larc.nasa.gov/" target="_blank" rel="noopener">NASA POWER</a> (Langley Research Center), on a grid of about 50 km. Place search: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors. Statistics and charts are made only from the entries in this diary.</p><p class="hint" style="font-size:0.7941rem">Rain or Shine Almanac 1.0.5, made by Silent Tools. No account, no tracking, no ads. Your diary is stored only in this browser on this device.</p></section>`;
}

/* ---------- poster as an image ---------- */
async function savePoster(){
  const el=document.querySelector('.poster svg');if(!el)return;
  S.posterBusy=true;S.posterMsg='';S.posterErr=false;render();
  try{
    let src=el.outerHTML
      .replace(/var\(--f-display\)/g,"'Cormorant Garamond', Georgia, 'Times New Roman', serif")
      .replace(/var\(--f-data\)/g,"'IBM Plex Mono', Menlo, Consolas, monospace")
      .replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2240" ');
    const url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml'}));
    const img=new Image();
    await new Promise((ok,bad)=>{img.onload=ok;img.onerror=bad;img.src=url;});
    const c=document.createElement('canvas');c.width=1600;c.height=2240;c.getContext('2d').drawImage(img,0,0,1600,2240);URL.revokeObjectURL(url);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    if(!blob)throw new Error('png');
    const r=await saveFile(`rain-or-shine-poster-${S.year}.png`,blob,'image/png');
    S.posterMsg=r==='declined'?'Nothing was saved.':'Poster saved. It is 1600 × 2240 pixels, sharp enough to print at A5.';
  }catch(e){S.posterMsg=e&&e.message&&e.message!=='png'?e.message:'The poster could not be turned into an image on this device.';S.posterErr=true;}
  S.posterBusy=false;render();
}

/* ---------- demo ---------- */
const SHOP='https://silent-tools.github.io/';
function demoBanner(){return `<div class="demo-bar"><b>Demo with four years of sample entries.</b> Try every view, write an entry, change the settings. Nothing is saved: reload and it starts fresh. <a href="${SHOP}" target="_blank" rel="noopener">Get your own diary</a></div>`;}
addSamples();
for(const e of Object.values(DB.entries))e.sample=false;
S.setup=false;
/* ---------- render & events ---------- */
function render(){
  applyTheme();renderHome();
  if(!visibleTabs().some(t=>t[0]===S.tab))S.tab='day';
  const V={day:dayView,year:yearView,month:monthView,chart:chartView,firsts:firstsView,stats:statsView,poster:posterView};
  document.getElementById('view').innerHTML=S.screen==='backup'?backupView():S.screen==='views'?viewsView():S.screen==='settings'?settingsView():S.setup?setupView():V[S.tab]();
  if(S.screen==='day'&&!S.setup&&S.tab==='chart')wireChart();
  const sel=document.querySelector('.chips .chip[aria-pressed="true"]');
  if(sel){const c=sel.parentElement,r=sel.offsetLeft+sel.offsetWidth-c.clientWidth;if(r>c.scrollLeft)c.scrollLeft=r+8;}
}
const view=document.getElementById('view');
view.addEventListener('submit',async ev=>{
  if(ev.target.id!=='search-form')return;ev.preventDefault();
  const inp=document.getElementById('place-q');inp.blur();
  const q=inp.value.trim();S.search.q=q;S.search.busy=true;render();
  const r=await searchPlaces(q);S.search={q,results:r.list,live:r.live,matched:r.matched,busy:false};render();
});
view.addEventListener('change',ev=>{
  if(ev.target.id!=='restore-file')return;
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{S.bk={busy:'',msg:'',err:'',preview:readBackup(String(rd.result))};}catch(e){S.bk={busy:'',msg:'',err:e.message,preview:null};}render();};
  rd.onerror=()=>{S.bk={busy:'',msg:'',err:'The file could not be read. Try choosing it again.',preview:null};render();};
  rd.readAsText(f);
});
view.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.place!==undefined){const p=S.search.results[+b.dataset.place];DB.settings.home={name:p.name,country:p.country,lat:Math.round(p.lat*1000)/1000,lon:Math.round(p.lon*1000)/1000};save();S.setup=false;S.search={q:'',results:null,live:true,matched:true,busy:false};render();return;}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.mode='view';render();window.scrollTo(0,0);return;}
  if(b.dataset.year){S.year=+b.dataset.year;render();return;}
  if(b.dataset.px){S.pxMode=b.dataset.px;render();return;}
  if(b.dataset.first!==undefined){readDraft();const k=b.dataset.first,f=S.draft.firsts;const i=f.indexOf(k);i>=0?f.splice(i,1):f.push(k);render();return;}
  if(b.dataset.unit){const[k,v]=b.dataset.unit.split(':');DB.settings.units={...U(),[k]:v};save();render();return;}
  if(b.dataset.tsize){DB.settings.textSize=b.dataset.tsize;save();render();return;}
  if(b.dataset.themePick){DB.settings.theme=b.dataset.themePick;DB.settings.handwriting=b.dataset.themePick!=='minimal';save();render();return;}
  if(b.dataset.toggleview){const k=b.dataset.toggleview,hid=new Set(DB.settings.hiddenTabs||[]);hid.has(k)?hid.delete(k):hid.add(k);DB.settings.hiddenTabs=[...hid];save();render();return;}
  if(b.dataset.open){S.tab='day';goDate(b.dataset.open);return;}
  if(b.dataset.src){readDraft();S.draft.source=b.dataset.src;S.msg='';if(b.dataset.src==='online'&&S.wstate.status!=='ok'&&S.wstate.status!=='loading')loadWeather();render();return;}
  if(b.dataset.sky){readDraft();S.draft.m.sky=b.dataset.sky;S.msg='';render();return;}
  if(b.dataset.pr){readDraft();S.draft.m.precip=b.dataset.pr;render();return;}
  const a=b.dataset.act;
  if(a==='prev')goDate(addDays(S.date,-1));
  else if(a==='next')goDate(addDays(S.date,1));
  else if(a==='today')goDate(todayIso());
  else if(a==='new'||a==='edit'){startEdit();render();const n=document.getElementById('note');if(n)n.focus();}
  else if(a==='cancel'){S.mode='view';S.msg='';render();}
  else if(a==='save')saveEntry();
  else if(a==='retry'){loadWeather();render();}
  else if(a==='delete'){S.confirmDelete=true;S.toast='';render();}
  else if(a==='delete-no'){S.confirmDelete=false;render();}
  else if(a==='delete-yes'){delete DB.entries[S.date];save();S.confirmDelete=false;S.toast='';render();}
  else if(a==='cancel-setup'){S.setup=false;render();}
  else if(a==='open-backup'){S.screen='backup';S.mode='view';S.bk={busy:'',msg:'',err:'',preview:null};render();window.scrollTo(0,0);}
  else if(a==='close-backup'){S.screen=S.from==='settings'?'settings':'day';render();window.scrollTo(0,0);}
  else if(a==='bk-json')doBackup('json');
  else if(a==='bk-xlsx')doBackup('xlsx');
  else if(a==='merge-yes'&&S.bk.preview)applyMerge(S.bk.preview);
  else if(a==='merge-no'){S.bk.preview=null;render();}
  else if(a==='mprev'){const ys=dataYears();if(S.month===0){if(S.year>ys[0]){S.year--;S.month=11;}}else S.month--;render();}
  else if(a==='mnext'){const ys=dataYears();if(S.month===11){if(S.year<ys[ys.length-1]){S.year++;S.month=0;}}else S.month++;render();}
  else if(a==='open-views'){S.screen='views';render();window.scrollTo(0,0);}
  else if(a==='close-views'){S.screen=S.from==='settings'?'settings':'day';render();window.scrollTo(0,0);}
  else if(a==='open-settings'){S.screen='settings';S.from='settings';render();window.scrollTo(0,0);}
  else if(a==='close-settings'){S.screen='day';S.from='';render();window.scrollTo(0,0);}
  else if(a==='toggle-hand'){DB.settings.handwriting=DB.settings.handwriting===false;save();render();}
  else if(a==='poster-save')savePoster();
  else if(a==='change-home'){S.screen='day';S.from='';S.setup=true;S.mode='view';render();window.scrollTo(0,0);}
  else if(a==='first-add'){readDraft();const inp=document.getElementById('first-own'),v=(inp&&inp.value||'').trim().replace(/\s+/g,' ');if(v){const k='c:'+v.charAt(0).toUpperCase()+v.slice(1);if(!S.draft.firsts.includes(k))S.draft.firsts.push(k);}render();}
  else if(a==='samples-add'){addSamples();render();}
  else if(a==='samples-remove'){removeSamples();render();}
  else if(a==='a2hs-hide'){DB.settings.hideA2HS=true;save();render();}
});
document.getElementById('tabs').addEventListener('click',ev=>{const b=ev.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.mode='view';render();window.scrollTo(0,0);});
document.getElementById('home').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.act==='change-home'){S.setup=true;S.mode='view';render();}
  if(b.dataset.act==='open-settings'){S.screen='settings';S.from='settings';S.mode='view';render();window.scrollTo(0,0);}
  if(b.dataset.act==='open-backup'){S.from='';S.screen='backup';S.mode='view';S.bk={busy:'',msg:'',err:'',preview:null};render();window.scrollTo(0,0);}
});
save();render();warmMet();
})();
