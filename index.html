<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silent Tools</title>
<meta name="description" content="Small, private tools that run in your browser. No account, no ads, your data stays with you.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#F3EFE8;--ink:#2A2420;--muted:#75695D;--line:#DCCFBD;--accent:#8C6A3C}
@media (prefers-color-scheme:dark){:root{--bg:#1A1714;--ink:#EFE7DA;--muted:#A99C8B;--line:#3A332C;--accent:#D5B47E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:56px 20px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:44px;margin:0 0 6px;line-height:1}
.lede{color:var(--muted);margin:0 0 36px}
a.tool{display:block;border-top:1px solid var(--line);padding:18px 0;color:inherit;text-decoration:none}
a.tool:last-of-type{border-bottom:1px solid var(--line)}
a.tool b{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;display:block}
a.tool span{color:var(--muted)}
a.tool:hover b{color:var(--accent)}
footer{margin-top:36px;font-size:13px;color:var(--muted)}
</style></head>
<body><main>
<h1>Silent Tools</h1>
<p class="lede">Small, private tools that run in your browser. No account, no ads, and your data stays on your device.</p>
<a class="tool" href="rain-or-shine/"><b>Rain or Shine Almanac</b><span>A one-line-a-day weather and memory journal.</span></a>
<footer>© 2026 Silent Tools</footer>
</main></body></html>
