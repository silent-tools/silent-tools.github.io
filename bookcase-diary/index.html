<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bookcase Diary</title>
<meta name="description" content="A reading diary for kids, in English and Estonian. Put your books on your own bookcase, tick the days you read, write one line, fill jars and collect badges. No account, the diary stays on your device.">
<meta name="theme-color" content="#F4EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookcase">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html{font-size:17px;font:-apple-system-body;font-family:inherit}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.lock{margin-top:24px}
.foot a{color:inherit}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;pointer-events:none}

</style>
<link rel="stylesheet" href="../fonts.css">
<style>
/* Layout: home is the child's bookcase (one per year). Tapping a spine opens a cream two-page book with a handwritten line for today. */
:root{
  --bg:#F4EEE6; --surface:#FFFDF9; --ink:#2C2622; --muted:#7A6E64; --line:#E6DCCF; --line-strong:#D3C4B2;
  --accent:#C8553D; --accent-ink:#FFFFFF; --ok:#2F9B5A; --ok-soft:#DDF1E3;
  --wood:#B07444; --wood-d:#87552F; --case:#E9D8C2; --paper:#FBF6EA; --pen:#2E3A6B; --pen-soft:#7A84A8; --rule:#D7DDEA;
  --f-display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --f-name:"Grandstander","Baloo 2",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1714; --surface:#26201B; --ink:#F3ECE4; --muted:#B5A79A; --line:#3A312A; --line-strong:#52463C;
  --accent:#EE8A6E; --accent-ink:#2A1610; --ok:#5FCB8A; --ok-soft:#1E3A29;
  --wood:#8E5D37; --wood-d:#6A4426; --case:#3A2F27; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1B1714; --surface:#26201B; --ink:#F3ECE4; --muted:#B5A79A; --line:#3A312A; --line-strong:#52463C;
  --accent:#EE8A6E; --accent-ink:#2A1610; --ok:#5FCB8A; --ok-soft:#1E3A29;
  --wood:#8E5D37; --wood-d:#6A4426; --case:#3A2F27; color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:0.9412rem;line-height:1.45;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 60px;display:grid;gap:14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{flex:1;min-width:0}
.brand h1{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;line-height:1;min-width:0}
.nm{font-family:var(--f-name);font-weight:800;font-size:2.3529rem;letter-spacing:.01em;overflow-wrap:anywhere;min-width:0}
.nm i{font-style:normal;display:inline-block;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.nm i:nth-child(odd){transform:rotate(-4deg) translateY(1px)}.nm i:nth-child(even){transform:rotate(3deg) translateY(-2px)}
.kind{font-family:var(--f-hand);font-weight:700;font-size:1.7647rem;color:var(--muted);white-space:nowrap}
.gear{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--accent);padding:0}
.gear svg{width:22px;height:22px}
nav{flex:1 0 100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:4px}
nav button{border:0;background:transparent;border-radius:14px;padding:8px 0;font-family:var(--f-display);font-weight:700;font-size:0.9412rem;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:1.2941rem;margin:0;line-height:1.15}
.hint{margin:0;font-size:0.8235rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:9px 18px;cursor:pointer;min-height:44px;font-family:var(--f-display);font-weight:700;font-size:0.9412rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.small{min-height:36px;padding:5px 12px;font-size:0.8235rem}
.msg{margin:0;color:#C2364B;font-weight:700;font-size:0.8824rem}
.ex{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-soft);border-radius:16px;padding:10px 12px;font-size:0.8235rem}

/* today strip */
.todaybar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.tick{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:3px dashed var(--line-strong);color:var(--muted)}
.tick.on{border:3px solid var(--ok);background:var(--ok);color:#fff}
.tick svg{width:30px;height:30px}
.todaybar b{font-family:var(--f-display);font-size:1.0588rem;display:block;line-height:1.2}
.week{display:flex;gap:6px;margin-top:4px}
.wd{width:24px;display:grid;justify-items:center;gap:2px;font-size:0.6471rem;color:var(--muted)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong)}
.dot.on{background:var(--ok);border-color:var(--ok)}
.dot.now{outline:2px solid var(--accent);outline-offset:1px}

/* goals */
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px 8px;align-items:end}
.jar{display:grid;justify-items:center;text-align:center;gap:2px;min-width:0}
.jar svg{max-width:100%;height:auto}
.jl{font-family:var(--f-hand);font-weight:700;font-size:1.1765rem;line-height:1.05;color:var(--ink);overflow-wrap:anywhere}
.jn{font-family:var(--f-display);font-weight:700;font-size:0.8824rem;color:var(--muted);font-variant-numeric:tabular-nums}
.jar.done .jn{color:var(--ok)}
.fall{animation:fall .7s cubic-bezier(.3,1.5,.5,1)}@keyframes fall{from{transform:translateY(-150px)}to{transform:none}}
.fall.d{animation-delay:.35s;animation-duration:.85s;animation-fill-mode:backwards}
#pop .jpop{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:rgba(30,22,16,.4);padding:16px;cursor:pointer}
.jcard{background:#FBF6EA;color:#2C2622;border-radius:26px;padding:20px 28px 18px;display:grid;justify-items:center;gap:4px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:popin .35s cubic-bezier(.2,1.5,.4,1);max-width:300px;text-align:center}
.jcard .jl{color:#2C2622;font-size:1.5882rem}.jcard .jn{color:#7A6E64;font-size:1.0rem}.jcard .hint{color:#7A6E64;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:0.7647rem}
.bpop svg{width:150px;height:150px;animation:spinin .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}@keyframes spinin{from{transform:perspective(400px) rotateY(200deg) scale(.3)}}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.bdg{display:grid;justify-items:center;gap:3px;text-align:center;font-size:0.7647rem;line-height:1.2;font-weight:700}
.bdg svg{width:72px;height:72px}
.bdg.off{color:var(--muted);font-weight:600}.bdg.off svg{filter:grayscale(1);opacity:.35}
.bdg.new svg{animation:pinpop .7s cubic-bezier(.2,1.6,.4,1)}@keyframes pinpop{from{transform:scale(.2) rotate(-30deg)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700;padding:10px 18px;border-radius:999px;z-index:70;max-width:calc(100% - 32px);text-align:center}
.goal{display:grid;gap:4px}
.goal .gt{display:flex;justify-content:space-between;gap:8px;font-size:0.8824rem}
.goal .gt b{font-family:var(--f-display);font-weight:700}
.goal .gt span{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.gbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.goal.done .gt span{color:var(--ok);font-weight:700}

/* bookcase */
.years{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:38px;font-family:var(--f-display);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.case{background:var(--case);border:10px solid var(--wood);border-radius:10px;padding:10px 8px 0;box-shadow:inset 0 6px 12px rgba(0,0,0,.12)}
.case-top{display:flex;justify-content:center;margin:-2px 0 12px}
.plate{position:relative;background:#FBF6EA;color:#2C2622;border:2px solid #C9A169;border-radius:8px;padding:5px 22px 6px;text-align:center;box-shadow:0 2px 0 #87552F,0 4px 8px rgba(0,0,0,.18);max-width:100%}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#B48A55;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.plate::before{left:7px}.plate::after{right:7px}
.plate b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.1176rem;line-height:1.15}
.plate span{display:block;font-family:var(--f-hand);font-weight:700;font-size:1.1765rem;line-height:1.05;color:#6B5444}
.shelves{display:flex;flex-wrap:wrap;column-gap:3px;row-gap:14px;align-items:flex-end;padding-bottom:14px;
  background:repeating-linear-gradient(to bottom,transparent 0 136px,var(--wood) 136px 146px,var(--wood-d) 146px 150px);background-position:0 0}
.slot{height:136px;display:flex;align-items:flex-end}
.spine{position:relative;width:var(--w);height:var(--h);border:0;border-radius:3px 3px 1px 1px;cursor:pointer;padding:8px 0;
  background:var(--pat,none),var(--c);color:#fff;writing-mode:vertical-rl;text-orientation:mixed;
  font-family:var(--f-display);font-weight:700;font-size:0.7647rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:inset -4px 0 0 rgba(0,0,0,.16),inset 2px 0 0 rgba(255,255,255,.18);text-shadow:0 1px 1px rgba(0,0,0,.35);transition:transform .15s}
.spine:hover{transform:translateY(-4px)}
.spine.done::before{content:"";position:absolute;right:4px;top:0;width:10px;height:74%;background:#2F9B5A;box-shadow:0 0 0 1.5px rgba(255,255,255,.7);clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%)}
.spine.reading::after{content:"";position:absolute;right:5px;top:0;width:7px;height:18px;background:#E8483A;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.stack{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 4px}
.lying{position:relative;display:block;width:var(--lw);height:var(--lh);border:0;border-radius:2px 4px 4px 2px;cursor:pointer;padding:0 8px 0 10px;background:var(--pat,none),var(--c);color:#fff;
  font-family:var(--f-display);font-weight:700;font-size:0.6471rem;line-height:var(--lh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.18);text-shadow:0 1px 1px rgba(0,0,0,.35);transition:transform .15s}
.lying:nth-child(odd){transform:translateX(-3px)}.lying:nth-child(even){transform:translateX(4px)}
.lying::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(255,255,255,.5)}
.lying:hover{filter:brightness(1.08)}
.spine.done{padding-right:14px}.spine.hasface{padding-bottom:22px}
.spine .face{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);writing-mode:horizontal-tb;font-size:0.7059rem;text-shadow:none}
.spine.new{animation:drop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.addspine{width:34px;height:110px;border:2px dashed var(--wood-d);border-radius:4px;background:transparent;color:var(--wood-d);font-family:var(--f-display);font-weight:800;font-size:1.5294rem;cursor:pointer;display:grid;place-items:center}
.yearb{justify-self:start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.7647rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;vertical-align:0;margin-right:5px;border-radius:2px}
.fact{background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:22px;padding:14px 16px;display:grid;gap:4px}
.fact b{font-family:var(--f-display);font-size:1.1765rem;line-height:1.2}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nb{background:var(--bg);border-radius:16px;padding:10px 6px;text-align:center}
.nb b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.5294rem;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.nb span{font-size:0.7647rem;color:var(--muted)}

/* open book overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(30,22,16,.55);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;justify-items:center;align-content:start}
.sheet{width:100%;max-width:520px;display:grid;gap:12px}
.sheet .close{justify-self:end;border:0;background:rgba(255,255,255,.9);color:#2C2622;border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:700;cursor:pointer;min-height:40px}
.open{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--paper);border-radius:6px 6px 10px 10px;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 0 6px var(--c,#C8553D);color:var(--pen);animation:openb .45s ease-out}
@keyframes openb{from{transform:perspective(900px) rotateX(18deg) scale(.92);opacity:0}to{transform:none;opacity:1}}
.open::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(120,90,50,.18) 45%,rgba(120,90,50,.28) 50%,rgba(120,90,50,.18) 55%,transparent);pointer-events:none}
.pg{padding:16px 14px 18px;min-height:340px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pg.l{padding-right:20px}.pg.r{padding-left:20px}
.hand{font-family:var(--f-hand);font-weight:600;color:var(--pen);line-height:1.15;overflow-wrap:anywhere}
.date{font-size:1.1765rem;color:var(--pen-soft)}
.btitle{font-size:1.7647rem;font-weight:700}
.bauthor{font-size:1.2353rem;color:var(--pen-soft)}
.small{font-family:var(--f-body);font-size:0.7059rem;color:#8A7F72}
.checks{margin-top:auto;display:grid;gap:6px}
.check{display:flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;padding:4px 0;text-align:left}
.check .bx{flex:none;width:40px;height:40px;border:2.5px solid var(--pen);border-radius:6px 4px 7px 5px;transform:rotate(-3deg);display:grid;place-items:center}
.check .bx svg{width:34px;height:34px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.2,1.6,.4,1)}
.check.on .bx svg{opacity:1;transform:none}
.check.fin .bx{border-color:#2F9B5A;border-width:3px}.check.fin.on span:last-child{color:#2F9B5A}
.check span{font-family:var(--f-hand);font-weight:700;font-size:1.4706rem;color:var(--pen);line-height:1.05}
.prompt{font-size:1.2941rem;color:var(--pen-soft)}
.note{flex:1;width:100%;min-height:200px;border:0;resize:none;background:transparent;font-family:var(--f-hand);font-weight:600;font-size:1.4706rem;line-height:32px;color:var(--pen);padding:0;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
.note::placeholder{color:#B9BFD3}
.note:focus{outline:none}
.saved{font-family:var(--f-body);font-size:0.7059rem;color:#8A7F72;min-height:16px}
.past{background:var(--paper);border-radius:12px;padding:12px 14px;display:grid;gap:6px;color:var(--pen)}
.past h3{margin:0;font-family:var(--f-display);font-size:0.9412rem;color:#5F574F}
.past p{margin:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start}
.star{border:0;background:transparent;cursor:pointer;color:#C98F12;min-width:44px;min-height:44px;padding:0 4px;font-family:var(--f-body);font-size:0.7647rem}
.star b{font-size:1.6471rem;line-height:1;vertical-align:-3px}
.star[aria-pressed="true"] b{color:#E7A93A;text-shadow:0 1px 0 #A87B1C}
.srow{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}.tstar{min-width:0;color:#8A7F72;text-align:left}
.memobox{background:var(--bg);border-radius:14px;padding:10px;display:grid;place-items:center;min-height:200px}
.memobox img{width:100%;height:auto;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:inherit}
@media print{body *{visibility:hidden!important}#memoimg{visibility:visible!important;position:fixed;left:0;top:0;width:100%;height:auto;box-shadow:none}}
.past .pd{font-family:var(--f-body);font-size:0.7059rem;color:#8A7F72}
.past .pl{font-family:var(--f-hand);font-weight:600;font-size:1.2941rem;line-height:1.1;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{background:#FFFDF9;color:#2C2622;border-color:transparent}
.acts .btn.ok{background:var(--ok);color:#fff}

/* finished-book page */
.paperbox{background:var(--paper);border-radius:10px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.35);color:var(--pen);animation:openb .45s ease-out}
.frame{border:2.5px solid var(--pen);border-radius:7px 11px 8px 10px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--pen-soft);padding:20px 16px 18px;display:grid;gap:12px}
.pbh{font-size:2.4706rem;font-weight:700;text-align:center;line-height:1;transform:rotate(-2deg)}
.pq{font-size:1.4118rem}
.paperbox .faceb{background:transparent;border-color:#C9C2B4}
.paperbox .btn{background:#FFFDF9;color:#2C2622}.paperbox .btn.ok{background:#2F9B5A;color:#fff;border-color:#2F9B5A}
.rib::before{animation:rib .9s .2s cubic-bezier(.3,1.3,.5,1) backwards}@keyframes rib{from{height:0}}
/* forms in sheet */
.panel{background:var(--surface);border-radius:22px;padding:16px;display:grid;gap:10px}
.panel label,.lbl{font-family:var(--f-display);font-weight:700;font-size:0.8824rem}
input[type=text],input[type=number],input[type=date]{width:100%;border:1.5px solid var(--line-strong);border-radius:14px;padding:10px 12px;font-size:0.9412rem;background:var(--bg);min-width:0}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.patb{width:38px;height:56px;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0}
.patb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.faceb{font-size:1.7647rem;border:2px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:4px 10px;cursor:pointer;min-height:52px}
.faceb[aria-pressed="true"]{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:10px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);font-weight:700}
.prevspine{display:flex;gap:14px;align-items:center}

/* calendar */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead h2{text-transform:capitalize}
.nav2{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:1.2941rem;line-height:1}
.nav2:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.gh{text-align:center;font-size:0.7059rem;color:var(--muted);font-weight:700}
.day{aspect-ratio:1;max-width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:0.9412rem;padding:0;position:relative}
.day.on{background:var(--ok);border-color:var(--ok);color:#fff}
.day.hasnote::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#fff}
.day.now{outline:2px solid var(--accent);outline-offset:1px}
.day:disabled{opacity:.35;cursor:default}
.day.blank{visibility:hidden}

/* goals editor */
.gedit{display:grid;gap:10px}
.gi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.gi input[type=checkbox]{width:24px;height:24px;margin-top:2px;accent-color:var(--ok)}
.gi .gf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gi .gf input[type=number]{width:84px}
.gi .gf input[type=date]{width:auto}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}
.hold.going i{width:100%;transition:width 2s linear}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:40%;left:50%;width:9px;height:13px;border-radius:3px;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(400deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.fall,.bdg.new svg,.jcard,.bpop svg,.rib::before{animation:none}.confetti{display:none}.open,.spine.new{animation:none}.spine{transition:none}}
.danger{margin-top:28px;border-color:#E9B8B8}.dangerbtn{border-color:#C2364B;color:#C2364B}.dangerbtn:disabled{opacity:.4;cursor:default}
.daylist{display:grid;gap:8px}.dayb{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-strong);background:var(--bg);border-radius:14px;padding:8px 12px;cursor:pointer;text-align:left;min-height:52px}
.dayb[aria-pressed="true"]{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}.dayb:disabled{cursor:default}.dayb i{flex:none;width:12px;height:34px;border-radius:2px}.dayb b{font-family:var(--f-display);display:block;line-height:1.2}.dayb small{color:var(--muted)}.dayb .ck{margin-left:auto;color:var(--ok);font-size:1.2941rem;font-weight:800}
.notice{background:var(--surface);border:1.5px solid #E7A93A;border-radius:18px;padding:12px 14px;display:grid;gap:6px;font-size:0.8529rem}.notice p{margin:0}.notice ol{margin:4px 0 0;padding-left:20px}.notice b{font-family:var(--f-display)}
details summary{cursor:pointer;font-weight:700;font-size:0.8529rem}details ol{padding-left:20px;font-size:0.8529rem}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.welcome{border-color:var(--accent)}
.foot{font-size:0.7353rem;color:var(--muted);text-align:center}
@media (max-width:360px){.pg{padding-left:10px;padding-right:12px}.pg.r{padding-left:14px}.btitle{font-size:1.5294rem}.note{font-size:1.2941rem}.check span{font-size:1.2941rem}}
</style>

      if(t.value.trim()||had){DB.logs[t0][bk.id]=Object.assign(DB.logs[t0][bk.id]||{},{n:t.value.slice(0,400)});if(!had){if(bk.status==='want')bk.status='reading';const c=document.querySelector('.check');if(c){c.classList.add('on');c.setAttribute('aria-pressed','true');c.querySelector('span:last-child').textContent=w().readTodayOn;}}}
      delete DB.example;save();const fr=checkBadges();if(fr.length){S.newBadges=fr;confetti();fr.forEach(badgePop);}const s=document.getElementById('saved');if(s)s.textContent=w().saved+' ✓';},400);}
  if(t.id==='wname'){const v=t.value.trim();if(v.length<=20){DB.settings.name=v;save();document.getElementById('who').innerHTML=titleHTML();}}
  if(t.id==='name'){const v=t.value.trim();if(v.length<=20){DB.settings.name=v;delete DB.example;save();document.getElementById('who').innerHTML=titleHTML();}}
  if(t.dataset.gn||t.dataset.gd){const k=t.dataset.gn||t.dataset.gd,G=DB.settings.goals=DB.settings.goals||{};G[k]=G[k]||{on:false,n:1};if(t.dataset.gn)G[k].n=Math.max(1,Math.min(9999,parseInt(t.value)||1));else G[k].d=t.value;save();}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='bk-file'){const fl=t.files&&t.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{S.bk={preview:readBackupFile(String(rd.result))};}catch(er){S.bk={msg:er.message,err:true};}render();};rd.onerror=()=>{S.bk={msg:w().bkRead,err:true};render();};rd.readAsText(fl);return;}if(t.dataset.gk){const k=t.dataset.gk,G=DB.settings.goals=DB.settings.goals||{};const n=document.querySelector(`[data-gn="${k}"]`),dd=document.querySelector(`[data-gd="${k}"]`);
  G[k]={on:t.checked,n:Math.max(1,parseInt(n&&n.value)||1),d:dd?dd.value:(G[k]||{}).d,from:(G[k]&&G[k].from)||today()};save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.sheet||S.mode))closeSheet();});
checkBadges();
render();
})();
