<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happily Seated · Demo</title>
<meta name="description" content="A wedding seating planner for your phone and computer. Import your guest list, seat everyone, print and share. No account, your plan stays on your device.">
<meta name="theme-color" content="#EEE6DA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1714" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
html{font-size:17px;font:-apple-system-body;font-family:inherit}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.lock{margin-top:24px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60;pointer-events:none}
.foot a{color:var(--accent)}
.demo-bar{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45}.demo-bar a{font-weight:600;white-space:nowrap;color:var(--accent)}
</style>
<link rel="stylesheet" href="../../fonts.css">
<style>
/* Theme: Beige (warm paper, bronze accent). Same tokens as Rain or Shine. */
:root{
  --bg:#EEE6DA; --surface:#FAF6EF; --ink:#2A2420; --muted:#75695D; --line:#E2D7C7; --line-strong:#C9B9A2;
  --accent:#8C6A3C; --accent-soft:#EFE3CF; --warn:#8F5A12; --warn-soft:#F6E7CC; --danger:#A3322A; --danger-soft:#F5DCD8; --ok:#4E7A4A;
  --f-display:"Cormorant Garamond","Didot",Georgia,serif;
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --d-weight:700;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1714; --surface:#24201C; --ink:#EFE7DA; --muted:#A99C8B; --line:#36302A; --line-strong:#50473D;
  --accent:#D5B47E; --accent-soft:#3A2F22; --warn:#E8B565; --warn-soft:#3A2C17; --danger:#F08A80; --danger-soft:#3D1F1C; --ok:#8FC28A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1714; --surface:#24201C; --ink:#EFE7DA; --muted:#A99C8B; --line:#36302A; --line-strong:#50473D;
  --accent:#D5B47E; --accent-soft:#3A2F22; --warn:#E8B565; --warn-soft:#3A2C17; --danger:#F08A80; --danger-soft:#3D1F1C; --ok:#8FC28A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:0.8824rem;line-height:1.45;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 120px;min-width:0}
@media (min-width:900px){.app{max-width:1180px}}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:var(--d-weight);font-size:1.7647rem;margin:0;line-height:1}
.brand em{font-style:italic;font-weight:600;color:var(--accent)}
.hdr-sub{font-size:0.7647rem;color:var(--muted)}
nav.tabs{flex:1 0 100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
nav.tabs button{border:0;background:transparent;border-radius:11px;padding:9px 0;font-size:0.8235rem;color:var(--muted);cursor:pointer;min-width:0}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{padding-block:14px 0;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);min-width:0}
main>*{min-width:0}
h2{font-family:var(--f-display);font-weight:var(--d-weight);font-size:1.4706rem;margin:6px 0 0;line-height:1.1}
h3{font-size:0.8824rem;margin:0;font-weight:600}
.muted{color:var(--muted)}
.hint{font-size:0.7647rem;color:var(--muted);margin:0}
.lbl{font-size:0.7059rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
textarea{width:100%;min-height:150px;border:1px solid var(--line-strong);border-radius:12px;padding:11px 12px;font-size:0.9412rem;background:var(--bg);resize:vertical}
input[type=text],input[type=number],input[type=search],select{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:9px 10px;font-size:0.9412rem;background:var(--bg);min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:12px;padding:3px;gap:3px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:0.8824rem;cursor:pointer;line-height:1.2;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-strong);background:transparent;border-radius:11px;padding:9px 15px;cursor:pointer;font-size:0.8529rem;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.small{padding:6px 11px;font-size:0.7647rem;min-height:34px}
.btn:disabled{opacity:.5;cursor:default}
label.btn{display:inline-flex;align-items:center}
.msg{font-size:0.8235rem;color:var(--danger);margin:0}
.toast{font-size:0.8235rem;color:var(--accent);font-weight:600;margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty{border:1px dashed var(--line-strong);border-radius:18px;padding:22px 16px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:0.7059rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pill.grp{border-color:var(--accent);color:var(--accent)}

/* import preview */
.pv{display:grid;gap:6px}
.pv-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.pv-item.off{opacity:.55}
.pv-item input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.pv-names{min-width:0;overflow-wrap:anywhere}
.pv-meta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.map{display:grid;gap:8px}
.map label{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;font-size:0.8235rem}
.map label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* guest list */
.glist{display:grid;gap:6px}
.gi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gi .nm{overflow-wrap:anywhere}
.gi .sub{grid-column:1;font-size:0.7353rem;color:var(--muted)}
.gi .act{grid-row:span 2;display:flex;gap:6px}
.ggroup{border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;gap:6px;background:var(--accent-soft)}
.ggroup>.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px;font-size:0.7647rem;color:var(--muted);flex-wrap:wrap}
.ggroup>.gh b{color:var(--ink);font-weight:600}
.edit{display:grid;gap:8px;background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:12px}

/* seating */
.seat-layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.seat-layout{grid-template-columns:300px minmax(0,1fr);align-items:start}.pool{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.pool{display:grid;gap:8px;align-content:start}
.pool-list{display:grid;gap:6px}
.pc{display:grid;gap:2px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;touch-action:manipulation}
.pc .pl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc small{font-size:0.7353rem;color:var(--muted)}
.pc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.pool.drop-hot{outline:2px dashed var(--accent);outline-offset:4px;border-radius:16px}
.tables{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.tables{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1500px){.tables{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;min-width:0}
.tcard.drop-hot,.tcard.can-drop{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tname{font-family:var(--f-display);font-weight:var(--d-weight);font-size:1.2941rem;line-height:1.1}
.tcount{font-size:0.7647rem;color:var(--muted)}
.tcount.full{color:var(--ok);font-weight:600}
.tdiag{display:block;width:120px;height:auto;margin:0 auto}
.tdiag .tb{fill:var(--accent-soft);stroke:var(--line-strong)}
.tdiag .s0{fill:var(--surface);stroke:var(--line-strong)}
.tdiag .s1{fill:var(--accent);stroke:var(--accent)}
.tdiag text{font-family:var(--f-data);font-size:0.6471rem;fill:var(--muted)}
.seats{display:grid;gap:4px}
.seats.long{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:6px}
.side-l{font-size:0.6765rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:2px 4px}
.seat{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:center;gap:6px;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;cursor:pointer;min-height:38px;touch-action:manipulation}
.seat .sn{font-family:var(--f-data);font-size:0.7059rem;color:var(--muted)}
.seat .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.8529rem}
.seat.free .who{color:var(--muted);font-style:italic}
.seat.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.seat.drop-hot{background:var(--accent-soft);border-color:var(--accent)}
.seat.grp .who::after{content:" ⚭";color:var(--accent)}
.ghost{position:fixed;z-index:100;pointer-events:none;background:var(--accent);color:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(10px,10px);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* bottom action bar (phone-friendly) */
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:flex;justify-content:center}
.selbar>div{max-width:720px;width:100%;display:grid;gap:8px}
.selbar p{margin:0;font-size:0.8824rem;line-height:1.35}
.selbar .btn{border-color:var(--bg);color:var(--bg);min-height:40px}
.selbar .btn.primary{background:var(--bg);color:var(--ink)}
.addt{display:grid;gap:10px}
.addt .f3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.addt label{display:grid;gap:4px;font-size:0.7647rem;color:var(--muted)}
.foot{font-size:0.7059rem;color:var(--muted);margin-top:18px}
.foot a{color:var(--accent)}

/* part 2: compact tables, quick fill, seating wishes */
.tcard{padding:0;gap:0;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;text-align:left;width:100%;border:0;background:transparent;padding:12px 14px;cursor:pointer;color:inherit;touch-action:manipulation}
.trow .tname{font-size:1.2353rem}
.tcount{font-size:0.7941rem;color:var(--muted)}
.tnames{grid-column:1/-1;font-size:0.7941rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.twarn{grid-column:1/-1;font-size:0.7647rem;color:var(--warn);font-weight:600}
.twarn.hard{color:var(--danger)}
.tcard.no-drop{opacity:.5}
.tbody{display:grid;gap:10px;padding:0 12px 12px}
.trow2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.trow2 .tdiag{margin:0}
.issues{margin:0;padding:8px 10px 8px 26px;border-radius:10px;background:var(--warn-soft);display:grid;gap:4px;font-size:0.7941rem}
.issues li.hard{color:var(--danger);font-weight:600}
.stools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fillbox{display:grid;gap:4px}
.seats.long .fillbox{grid-column:1/-1}
.fill{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:6px;align-items:center;border:2px solid var(--accent);border-radius:10px;padding:4px 6px;background:var(--surface)}
.fill .sn{font-family:var(--f-data);font-size:0.7059rem;color:var(--muted)}
.fill input{border:0;background:transparent;padding:6px 2px}
.sugg{display:grid;gap:4px}
.sg{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;display:grid;gap:2px;cursor:pointer;color:inherit;min-height:44px}
.sg small{color:var(--muted);font-size:0.7353rem}
.sg.bad small{color:var(--danger)}
.sg:disabled{opacity:.5;cursor:default}
.seat.free .who{font-size:0.7647rem}
.modes{display:grid;gap:6px}
.modes button{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:2px;cursor:pointer;color:inherit}
.modes button span{font-size:0.7647rem;color:var(--muted)}
.modes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipt{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 12px;font-size:0.8235rem;cursor:pointer;color:inherit;min-height:36px}
.chipt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chips-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pill.bad{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);display:inline-flex;align-items:center;gap:4px;white-space:normal}
.pill .x{border:0;background:none;color:inherit;font-size:0.9412rem;line-height:1;padding:0 2px;cursor:pointer}
.seg.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.four button{font-size:0.8235rem}
.seg2{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;gap:2px;background:var(--surface)}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-size:0.7353rem;cursor:pointer;color:inherit;white-space:nowrap}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.ggroup.loose{background:transparent;border-style:dashed}
.ws{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:8px;align-items:center;font-size:0.8235rem}
.searchrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}
.tables-col{display:grid;gap:12px;min-width:0}
.tables{align-items:start}
.pl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* part 3: print and export. Paper is always white, so these colours are fixed on purpose. */
:root{--paper:#FFFFFF;--pink:#2A2420;--pmuted:#6F6458;--paccent:#8C6A3C;--pline:#D6C8B4}
#measure{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none}
#print{display:none}
.outs{display:grid;gap:8px}
@media (min-width:900px){.outs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.outb{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;cursor:pointer;color:inherit}
.outb b{font-family:var(--f-display);font-size:1.1765rem}
.outb span{font-size:0.7941rem;color:var(--muted)}
.labvis{display:grid;gap:6px}
.lvd summary{cursor:pointer;font-weight:600;padding:4px 0;min-height:32px}
.lvd[open] summary{margin-bottom:8px}
.lv{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:4px 0 8px}
.pvw{display:grid;gap:6px;justify-items:center}
.pvp{position:relative;box-shadow:0 2px 12px rgba(40,25,10,.22);background:#fff;overflow:hidden}
.pvs{transform-origin:0 0;position:absolute;left:0;top:0}
.pvn{font-size:0.7059rem;color:var(--muted);margin-bottom:8px}
.sheet{font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;background:var(--paper);color:var(--pink);box-sizing:border-box;padding:14mm 13mm;overflow:hidden;display:flex;flex-direction:column;font-family:var(--f-body);font-size:10pt;line-height:1.35;position:relative;color-scheme:light;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ph{text-align:center;margin-bottom:7mm}
.ph-k{font-size:8.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--paccent);font-weight:600}
.ph-t{font-family:var(--f-display);font-weight:700;font-size:30pt;line-height:1.05;margin-top:2mm}
.ph-d{font-size:10.5pt;color:var(--pmuted);margin-top:1.5mm}
.ph.small{margin-bottom:4mm}
.flow{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:minmax(0,1fr);column-gap:7mm}
.fcol{min-height:0;overflow:hidden}
.pt-table{padding:0 0 calc(5mm * var(--z,1))}
.pt-tname{font-family:var(--f-display);font-weight:700;font-size:calc(15pt * var(--z,1));line-height:1.15;border-bottom:.3mm solid var(--pline);padding-bottom:1mm;margin-bottom:1.5mm}
.pt-tname span{font-family:var(--f-body);font-size:8pt;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--pmuted)}
.pt-names{list-style:none;margin:0;padding:0;font-size:calc(10pt * var(--z,1))}
.pt-names li{padding:.35mm 0}
.pt-empty{color:var(--pmuted);font-style:italic;font-size:9.5pt}
.fs-key{text-align:center;font-size:9pt;color:var(--pmuted);margin:-4mm 0 5mm}
.fs-letter{font-family:var(--f-display);font-weight:700;font-size:calc(17pt * var(--z,1));color:var(--paccent);line-height:1;margin:2.5mm 0 1mm}
.fs-row{display:flex;align-items:baseline;gap:1.5mm;padding:.45mm 0;font-size:calc(10pt * var(--z,1))}
.fs-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fs-dots{flex:1 1 3mm;border-bottom:.3mm dotted var(--pline);min-width:3mm;align-self:center;transform:translateY(1mm)}
.fs-t.word{font-family:var(--f-body);font-size:calc(8.5pt * var(--z,1));white-space:nowrap}
.fs-row .fs-n{flex:0 1 auto;white-space:normal;overflow:visible;line-height:1.2}
.fs-t{font-family:var(--f-data);font-size:calc(9.5pt * var(--z,1));white-space:nowrap;font-weight:500}
.s-two{padding:0}
.tc{height:50%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12mm 18mm;gap:5mm;overflow:hidden}
.tc+.tc{border-top:.3mm dashed var(--pline)}
.tc-k{font-size:9pt;letter-spacing:.22em;text-transform:uppercase;color:var(--paccent);font-weight:600}

.tc-names{font-size:11.5pt;color:var(--pmuted);max-width:160mm;line-height:1.6;text-wrap:balance}
.tc-names.many{font-size:9pt}
.s-cards{padding:0;align-items:center;justify-content:center}
.cards{display:grid;grid-template-columns:repeat(2,88.9mm)}
.pc-card{width:88.9mm;height:50.8mm;box-sizing:border-box;outline:.25mm dashed var(--pline);outline-offset:-.125mm;position:relative}
.pc-card.fold{height:101.6mm}

.pc-half{height:50.8mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;padding:4mm 6mm;box-sizing:border-box;text-align:center;position:relative}
.pc-half.top{transform:rotate(180deg)}
.pc-name{font-family:var(--f-display);font-weight:700;font-size:22pt;line-height:1.05}
.pc-name.long{font-size:17pt}.pc-name.xlong{font-size:13.5pt}
.pc-t{font-size:8.5pt;letter-spacing:.2em;text-transform:uppercase;color:var(--paccent);font-weight:600}
.pc-m{position:absolute;right:4mm;bottom:3mm;font-size:7.5pt;color:var(--pmuted)}
.s-party{padding:16mm 14mm}
.pty{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.pty-title{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:calc(46pt * var(--k));text-align:center;line-height:1;margin:calc(3mm * var(--k)) 0 calc(9mm * var(--k))}
.pty-grid{display:grid;grid-template-columns:repeat(var(--pc),minmax(0,1fr));gap:calc(5mm * var(--k)) 6mm;align-content:start}
.pi{text-align:center;padding-top:calc(3mm * var(--k));border-top:.3mm solid var(--pline)}
.pi-n{font-family:var(--f-display);font-weight:700;font-size:calc(40pt * var(--k));line-height:1;color:var(--paccent)}

.pi-names{font-size:calc(8.5pt * var(--k));color:var(--pmuted);margin-top:1.2mm;font-style:italic;line-height:1.3}

/* "Sit with": join the other guest's group, or start a together-if-possible pair */

}
function allTags(){const m=new Map();for(const g of Object.values(DB.guests))for(const t of g.tags||[]){const k=t.toLowerCase();if(!m.has(k))m.set(k,t);}return [...m.values()].sort((a,b)=>a.localeCompare(b));}
const tagSet=ids=>new Set(ids.flatMap(id=>(DB.guests[id].tags||[]).map(x=>x.toLowerCase())));
function sideOfUnit(u){const c={};u.ids.forEach(id=>{const s=DB.guests[id].side;if(s)c[s]=(c[s]||0)+1;});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'';}
const SIDE_LABEL={bride:'Bride’s side',groom:'Groom’s side',both:'Both sides'};

/* ---------- seating ---------- */
function seatOf(id){const sm=SM();for(const tid in sm){const i=sm[tid].indexOf(id);if(i>=0)return {tid,i};}return null;}

const tableById=tid=>T().find(t=>t.id===tid);
const arr=tid=>{const t=tableById(tid),sm=SM();if(!sm[tid])sm[tid]=[];while(sm[tid].length<t.seats)sm[tid].push(null);sm[tid].length=t.seats;return sm[tid];};
const free=tid=>arr(tid).filter(x=>!x||!DB.guests[x]).length;
const seated=()=>{const s=new Set();for(const a of Object.values(SM()))a.forEach(x=>x&&s.add(x));return s;};
/* order to walk the seats from a start seat, so a group sits side by side */
function walk(t,start){
  const n=t.seats,o=[];
  if(t.shape==='long'){const k=Math.ceil(n/2),side=start<k?0:1,a=side?[...Array(n-k)].map((_,i)=>k+i):[...Array(k)].map((_,i)=>i),b=side?[...Array(k)].map((_,i)=>i):[...Array(n-k)].map((_,i)=>k+i);
    const pos=a.indexOf(start);return [...a.slice(pos),...a.slice(0,pos).reverse(),...b];}
  for(let i=0;i<n;i++)o.push((start+i)%n);return o;

let HIST=[];
function snapshot(){HIST.push(JSON.stringify(SM()));if(HIST.length>50)HIST.shift();}

/* place ids at table tid, starting at seat (or first free). Returns '' or an error message. */
function place(ids,tid,seat){
  const t=tableById(tid);if(!t||!ids.length)return 'Nothing to place.';
  const before=JSON.stringify(SM());
  const from=ids.length===1?seatOf(ids[0]):null;
  unseat(ids);
  const a=arr(tid);
  if(ids.length===1&&seat!=null){
    const occ=a[seat];
    a[seat]=ids[0];
    if(occ&&occ!==ids[0]){if(from&&!(from.tid===tid&&from.i===seat))arr(from.tid)[from.i]=occ;}
    return '';
  }
  const order=walk(t,seat==null?Math.max(0,a.findIndex(x=>!x)):seat).filter(i=>!a[i]);
  if(order.length<ids.length){DB.seats[ev()]=JSON.parse(before);return `${t.name} has ${order.length} free ${order.length===1?'seat':'seats'}, and ${ids.length} people need one.`;}
  ids.forEach((id,k)=>a[order[k]]=id);

}
function addTables(shape,seats,count){
  const list=T();let next=list.reduce((m,t)=>{const k=+(String(t.name).match(/^Table (\d+)$/)||[])[1];return k>m?k:m;},0);
  for(let i=0;i<count;i++){const id=uid();list.push({id,name:`Table ${++next}`,shape,seats});SM()[id]=Array(seats).fill(null);}

}
function resizeTable(tid,seats){const t=tableById(tid);const a=arr(tid);const bumped=a.slice(seats).filter(Boolean);t.seats=seats;const n=arr(tid);bumped.forEach(id=>{const k=n.indexOf(null);if(k>=0)n[k]=id;});const lost=bumped.filter(id=>!n.includes(id)).length;save();return lost;}

/* who a seat touches: next to (and across, at a long table) */

  if(t.shape==='long'){const k=Math.ceil(n/2),side=i<k?0:1,j=side?i-k:i,len=side?n-k:k,base=side?k:0,o={next:[],across:[]};
    if(j>0)o.next.push(base+j-1);if(j<len-1)o.next.push(base+j+1);const acr=side?j:k+j;if(acr<n&&(side?acr<k:true))o.across.push(acr);return o;}
  return {next:n>1?[...new Set([(i+n-1)%n,(i+1)%n])].filter(x=>x!==i):[],across:[]};
}

/* ---------- what each table needs to know ---------- */
const seatedAt=tid=>arr(tid).filter(x=>x&&DB.guests[x]);
function tableIssues(tid){
  const ids=seatedAt(tid),set=new Set(ids),out=[],seen=new Set();
  for(const id of ids)for(const o of apartOf(id))if(set.has(o)){const k=[id,o].sort().join();if(!seen.has(k)){seen.add(k);out.push({hard:true,text:`${DB.guests[id].name} and ${DB.guests[o].name} are meant to be kept apart.`});}}
  for(const id of ids){const gr=grp(id);if(!gr)continue;
    for(const m of members(gr.id)){if(m.id===id||set.has(m.id))continue;const at=seatOf(m.id);const k='w'+[id,m.id].sort().join();
      if(at&&!seen.has(k)){seen.add(k);out.push({hard:false,text:`${DB.guests[id].name} ${isMust(gr)?'came with':'would like to sit with'} ${m.name}, who is at ${tableById(at.tid).name}.`});}}}
  return out;
}
/* how well a unit of guests fits a table; -1e9 means it must not go there */
function unitScore(u,tid,mode){
  const ids=seatedAt(tid).filter(x=>!u.ids.includes(x)),set=new Set(ids);let s=0;
  for(const id of u.ids){
    if(apartOf(id).some(o=>set.has(o)))return -1e9;
    const gr=grp(id);if(gr)for(const m of members(gr.id))if(set.has(m.id))s+=isMust(gr)?80:50;
  }
  const ut=tagSet(u.ids),tt=ids.flatMap(id=>(DB.guests[id].tags||[]).map(x=>x.toLowerCase()));
  const overlap=tt.filter(x=>ut.has(x)).length,tagged=ids.filter(id=>(DB.guests[id].tags||[]).length).length;
  const us=sideOfUnit(u),sides=ids.map(id=>DB.guests[id].side).filter(x=>x&&x!=='both');
  const same=us&&us!=='both'?sides.filter(x=>x===us).length:0,other=us&&us!=='both'?sides.filter(x=>x!==us).length:0;
  if(mode==='side'){s+=same*6-other*8+overlap;if(!ids.length&&us&&us!=='both')s+=2;s+=ids.length*.1;}
  else if(mode==='mix'){s-=overlap*5;s+=(ut.size?tagged:0)*.5;s-=ids.length*.6;}
  else{s+=overlap*6+same-other;if(ut.size&&!overlap)s+=ids.length?-tagged*.5:3;s+=ids.length*.1;}
  return s;
}

  const ids=seatedAt(tid).filter(x=>!u.ids.includes(x)),set=new Set(ids),r=[];
  for(const id of u.ids){const c=apartOf(id).find(o=>set.has(o));if(c)return {bad:true,text:`Keep apart from ${DB.guests[c].name}`};}
  for(const id of u.ids){const gr=grp(id);if(!gr)continue;const m=members(gr.id).find(x=>x.id!==id&&set.has(x.id));if(m){r.push(`Sits with ${m.name}`);break;}}
  const tt=tagSet(ids),sh=[...new Set(u.ids.flatMap(id=>DB.guests[id].tags||[]))].filter(x=>tt.has(x.toLowerCase()));
  if(sh.length)r.push('Also '+sh.slice(0,2).join(', '));
  const us=sideOfUnit(u);if(us&&us!=='both'&&ids.some(id=>DB.guests[id].side===us))r.push(SIDE_LABEL[us]);
  return {bad:false,text:r.join(' · ')};
}
function seatForMe(mode){
  snapshot();
  const freq={};Object.values(DB.guests).forEach(g=>(g.tags||[]).forEach(t=>{t=t.toLowerCase();freq[t]=(freq[t]||0)+1;}));
  const uf=u=>Math.max(0,...u.ids.flatMap(id=>(DB.guests[id].tags||[]).map(t=>freq[t.toLowerCase()]||0)));
  const units=poolUnits().sort((a,b)=>b.ids.length-a.ids.length||(mode==='side'?sideOfUnit(a).localeCompare(sideOfUnit(b)):uf(b)-uf(a)));

  for(const u of units){
    let best=null,bs=-Infinity;
    for(const t of T()){if(free(t.id)<u.ids.length)continue;const sc=unitScore(u,t.id,mode);if(sc>bs){bs=sc;best=t;}}
    if(!best||bs<=-1e8||place(u.ids,best.id,null)){left+=u.ids.length;continue;}
    placed+=u.ids.length;

  if(!placed)HIST.pop();
  save();return {placed,left};
}

  const host=mkHost(),pg=toEl(pages[0]);host.appendChild(pg);
  const cs=[...pg.querySelectorAll('.fcol')],full=cs[0].clientHeight;
  const used=cs.reduce((s,c)=>s+[...c.children].reduce((a,e)=>a+e.offsetHeight,0),0);host.innerHTML='';
  for(let lim=Math.ceil(used/opts.cols);lim<full;lim=Math.ceil(lim*1.04)+4){

function flowOnce(blocks,{cols,head,firstHead,cls,foot,z},lim){
  const host=mkHost(),pages=[];let pg,cs,ci;
  const start=()=>{pg=toEl(`${sheetOpen(cls,z)}${pages.length?(head||''):(firstHead||head||'')}<div class="flow" style="--cols:${cols}">${'<div class="fcol"></div>'.repeat(cols)}</div>${foot||''}</div>`);host.appendChild(pg);cs=[...pg.querySelectorAll('.fcol')];ci=0;};
  const over=c=>{if(c.scrollHeight>c.clientHeight+1)return true;if(!lim)return false;const l=c.lastElementChild;return !!l&&(l.getBoundingClientRect().bottom-c.getBoundingClientRect().top)>lim+1;};

function mealData(){
  const meals=[...new Set(EG().map(g=>tidy(g.meal)||'Not chosen'))].sort((a,b)=>(a==='Not chosen')-(b==='Not chosen')||a.localeCompare(b));
  const rows=T().map(t=>{const c={};seatedAt(t.id).forEach(id=>{const m=tidy(DB.guests[id].meal)||'Not chosen';c[m]=(c[m]||0)+1;});return {name:t.name,c,tot:seatedAt(t.id).length};});
  const un=EG().filter(g=>!seatOf(g.id));
  if(un.length){const c={};un.forEach(g=>{const m=tidy(g.meal)||'Not chosen';c[m]=(c[m]||0)+1;});rows.push({name:'No seat yet',c,tot:un.length});}
  return {meals,rows};
}
function mealPages(){

}

function buildXlsx(){
  if(!window.XLSX)throw new Error('The spreadsheet maker didn’t load. Check your internet connection and reload the page.');
  const ord=tableOrder(),list=EG().map(g=>({g,at:seatOf(g.id)})).sort((a,b)=>(a.at?ord[a.at.tid]:1e6)-(b.at?ord[b.at.tid]:1e6)||(a.at?a.at.i:0)-(b.at?b.at.i:0)||byOrd(a.g,b.g));
  const seatLabel=at=>{const t=tableById(at.tid);if(t.shape!=='long')return at.i+1;const k=Math.ceil(t.seats/2);return at.i<k?'A'+(at.i+1):'B'+(at.i-k+1);};
  const G=[['Name','Table','Seat','Side','Meal','Labels','Sits with','How','Keep apart from','Note']].concat(list.map(({g,at})=>{const gr=grp(g.id);
    return [g.name,at?tableById(at.tid).name:'No seat yet',at?seatLabel(at):'',g.side?SIDE_LABEL[g.side]:'',g.meal||'',(g.tags||[]).join(', '),gr?members(gr.id).filter(x=>x.id!==g.id).map(x=>x.name).join(', '):'',gr?(isMust(gr)?'Always together':'If possible'):'',apartOf(g.id).map(o=>DB.guests[o].name).join(', '),g.note||''];}));
  const TB=[['Table','Shape','Seats','Taken','Guests']].concat(T().map(t=>{const ids=seatedAt(t.id);return [t.name,t.shape==='long'?'Long':'Round',t.seats,ids.length,ids.map(id=>DB.guests[id].name).join(', ')];}));
  const {meals,rows}=mealData(),tot={};rows.forEach(r=>meals.forEach(m=>tot[m]=(tot[m]||0)+(r.c[m]||0)));
  const M=[['Table',...meals,'Total']].concat(rows.map(r=>[r.name,...meals.map(m=>r.c[m]||0),r.tot]),[['All guests',...meals.map(m=>tot[m]||0),EG().map(g=>g.id).length]]);
  const wb=XLSX.utils.book_new();
  const add=(rows,name,cols)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=cols.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,name);};
  add(G,'Guests',[26,14,6,14,14,30,30,16,26,30]);add(TB,'Tables',[16,8,7,7,80]);add(M,'Meals by table',[16,...meals.map(()=>12),8]);
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}
async function saveFile(name,data,mime){
  const file=new File([data],name,{type:mime});
  if(navigator.canShare&&navigator.share&&/iPhone|iPad|Android/i.test(navigator.userAgent||'')){
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'saved';}}catch(e){if(e&&e.name==='AbortError')return 'declined';}
  }
  const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  return 'saved';
}

const firstLast=n=>{if(isGuestOf(n))return {first:n,last:''};const t=n.split(' ').filter(x=>x&&!TITLE.test(x));return t.length<2?{first:n,last:''}:{first:t.slice(0,-1).join(' '),last:t[t.length-1]};};
function seatedList(){
  const ord=tableOrder();
  return Object.values(DB.guests).map(g=>({g,at:seatOf(g.id)})).filter(x=>x.at).sort((a,b)=>ord[a.at.tid]-ord[b.at.tid]||a.at.i-b.at.i);
}
function seatName(at){const t=tableById(at.tid);if(t.shape!=='long')return String(at.i+1);const k=Math.ceil(t.seats/2);return at.i<k?'A'+(at.i+1):'B'+(at.i-k+1);}
function canvaRows(){
  if(S.oo.crow==='table'){
    const max=Math.max(1,...T().map(t=>seatedAt(t.id).length));
    return [['Table',...[...Array(max)].map((_,i)=>'Guest '+(i+1))]].concat(T().map(t=>{const n=seatedAt(t.id).map(id=>DB.guests[id].name);return [t.name,...n,...Array(max-n.length).fill('')];}));
  }
  return [['Full name','First name','Last name','Table','Seat','Meal']].concat(seatedList().map(({g,at})=>{const f=firstLast(g.name);return [g.name,f.first,f.last,tableById(at.tid).name,seatName(at),g.meal||''];}));

const csvCell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
function xlsxOf(sheets){

}

async function designerSave(kind){

function readFile(f){
  S.msg='';S.toast='';

    try{

        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});}
      else if(isText){const tx=String(rd.result),sep=tx.includes('\t')?'\t':(tx.split(';').length>tx.split(',').length?';':',');rows=tx.split(/\r?\n/).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'')));}

      rowsPreview(rows);
    }catch(e){S.msg=e.message||'This file could not be read.';}

window.addEventListener('pointermove',ev=>{
  if(!drag)return;
  if(!drag.on){if(Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)<6)return;
    drag.on=true;const k=drag.key;
    if(k.startsWith('g:')){const u=poolUnits().find(x=>x.key===k);drag.sel=u?{key:u.key,ids:u.ids,label:u.label}:null;}
    else{const pu=poolUnits().find(x=>x.key===k);drag.sel=pu?{key:k,ids:pu.ids,label:pu.label}:selFromGuest(k.slice(2));}
    if(!drag.sel){drag=null;return;}
    drag.ghost=document.createElement('div');drag.ghost.className='ghost';drag.ghost.textContent=drag.sel.label+(drag.sel.ids.length>1?` (${drag.sel.ids.length})`:'');document.body.appendChild(drag.ghost);document.body.classList.add('dragging');}
  drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px';
  const el=document.elementFromPoint(ev.clientX,ev.clientY),hot=el&&el.closest('[data-drop]');
  if(hot!==drag.hot){if(drag.hot)drag.hot.classList.remove('drop-hot');drag.hot=hot;if(hot)hot.classList.add('drop-hot');}
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(!d.on)return;
  d.ghost.remove();document.body.classList.remove('dragging');if(d.hot)d.hot.classList.remove('drop-hot');
  dragJustEnded=true;setTimeout(()=>dragJustEnded=false,50);
  const h=d.hot;if(!h)return;
  if(h.dataset.drop==='pool'){snapshot();unseat(d.sel.ids);save();render();return;}
  S.sel=d.sel;
  if(h.dataset.drop==='seat'){const[tid,i]=h.dataset.seat.split(':');doPlace(tid,+i);}
  else doPlace(h.dataset.tid,null);
});

/* test hooks for the dev build only */
{const hv=location.hash.match(/^#v=([A-Za-z0-9_-]+)$/);if(hv){S.viewerMode=true;decodeView(hv[1]).then(p=>{S.viewerData=p;render();}).catch(()=>{S.viewerErr=true;render();});}}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.tab==='print'&&S.out)render();});
save();render();
})();
</script>
